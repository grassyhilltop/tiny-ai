<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codon v0.03</title>
<style>
  :root{
    --paper:#FAFAF8; --ink:#17171A; --mid:#84837C; --faint:#B4B2A8; --line:#E5E3DB; --card:#FFF;
    --live:#1E66C8; --brush:#EDF2FB; --wash:#F4F3EE;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --radius:5px; --faceH:26px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;}
  textarea:focus,input:focus{outline:none;}
  ::selection{background:#E6E4DA;}
  @keyframes toastin{0%{transform:translateY(5px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes ringout{0%{transform:scale(.4);opacity:.4}75%{transform:scale(1.6);opacity:0}100%{opacity:0}}
  @keyframes livepulse{0%,100%{opacity:.30}50%{opacity:.85}}
  input[type=range]{-webkit-appearance:none;appearance:none;height:2px;background:var(--ink);border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:#FFF;border:1.5px solid var(--ink);cursor:grab;}

  #app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- topbar ---------- */
  #topbar{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:#FCFCFA;flex:none;position:relative;z-index:30;}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand b{font-size:15px;letter-spacing:-.01em;font-weight:600;}
  .brand .tag{font-size:11px;color:var(--mid);}
  .vbadge{font-family:var(--mono);font-size:10.5px;border:1px solid var(--ink);border-radius:99px;padding:2px 8px;cursor:pointer;background:#FFF;user-select:none;}
  .vbadge:hover{background:var(--wash);}
  #vmenu{position:absolute;top:38px;left:88px;width:262px;background:#FFF;border:1.5px solid var(--ink);border-radius:7px;box-shadow:3px 3px 0 rgba(23,23,26,.10);padding:7px;display:none;font-size:12px;z-index:40;}
  #vmenu.open{display:block;}
  #vmenu .vrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 7px;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:11px;}
  #vmenu .vrow:hover{background:var(--wash);}
  #vmenu .vrow .vnote{color:var(--mid);font-size:10px;font-family:var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #vmenu hr{border:none;border-top:1px solid var(--line);margin:5px 3px;}
  #vmenu .vbtns{display:flex;gap:5px;padding:3px;}
  #vmenu .vbtns button{flex:1;font-size:10px;font-family:var(--mono);padding:5px 3px;border:1px solid var(--ink);background:#FFF;border-radius:4px;cursor:pointer;}
  #vmenu .vbtns button:hover{background:var(--ink);color:var(--paper);}
  .scenetabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#FFF;}
  .scenetabs span{font-size:11px;padding:3px 10px;border-radius:4px;cursor:pointer;color:var(--mid);user-select:none;white-space:nowrap;}
  .scenetabs span:hover{color:var(--ink);}
  .scenetabs span.on{background:var(--ink);color:var(--paper);}

  /* the isomorphism slider */
  #morphwrap{display:flex;align-items:center;gap:8px;margin-left:auto;user-select:none;}
  #morphwrap .ml{font-size:9.5px;font-family:var(--mono);color:var(--faint);letter-spacing:.05em;white-space:nowrap;}
  #morphwrap .ml.on{color:var(--ink);font-weight:600;}
  #morphwrap .ml.on{color:var(--ink);}
  #morphtrack{position:relative;width:150px;height:22px;display:flex;align-items:center;cursor:pointer;}
  #morphtrack .bar{position:absolute;left:0;right:0;height:2px;background:var(--line);border-radius:2px;}
  #morphtrack .fill{position:absolute;left:0;height:2px;background:var(--ink);border-radius:2px;}
  #morphtrack .stop{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--faint);transform:translate(-50%,-50%);top:50%;}
  #morphtrack .midlab{position:absolute;left:50%;top:15px;transform:translateX(-50%);pointer-events:none;}
  #morphtrack{overflow:visible;}
  #morphtrack .knob{position:absolute;width:14px;height:14px;border-radius:50%;background:#FFF;border:1.5px solid var(--ink);transform:translate(-50%,-50%);top:50%;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .tbtn{font-size:11.5px;border:1.5px solid var(--ink);border-radius:99px;padding:3px 11px;background:#FFF;cursor:pointer;user-select:none;white-space:nowrap;}
  .tbtn:hover{background:var(--ink);color:var(--paper);}
  #main{display:flex;flex:1;min-height:0;}

  /* ---------- palette ---------- */
  #pal{width:162px;flex:none;border-right:1px solid var(--line);background:#FCFCFA;padding:13px 11px;display:flex;flex-direction:column;gap:15px;overflow-y:auto;}
  #pal .grp{display:flex;flex-direction:column;gap:4px;}
  #pal .grp .h{font-size:9.5px;letter-spacing:.15em;color:var(--mid);font-family:var(--mono);margin-bottom:2px;}
  /* tiles hug their label; atoms show a small picture of what actually lands on the paper */
  #pal .grp{align-items:flex-start;}
  .ptile{padding:3px 9px;border:1px solid var(--line);border-radius:5px;background:#FFF;cursor:grab;
        font-size:11.5px;user-select:none;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);
        align-self:flex-start;}
  .ptile:hover{border-color:var(--ink);}
  .ptile.atom{border-color:var(--ink);border-width:1.5px;padding:2px 9px 2px 4px;}
  .ptile.egg{border:1.5px solid var(--ink);background:var(--wash);}
  .ptile .mini{display:flex;flex:none;}
  .ptile .pl{line-height:1;}
  #pal .hint{font-size:10px;color:var(--faint);line-height:1.5;font-family:var(--sans);}
  #pal .foot{margin-top:auto;font-size:9.5px;color:var(--faint);line-height:1.6;}
  #pal .foot code{font-family:var(--mono);}

  /* ---------- canvas ---------- */
  #canvasWrap{flex:1;position:relative;overflow:auto;}
  #paper{position:relative;width:3600px;height:2400px;}
  #grid,#guides{position:absolute;inset:0;pointer-events:none;}
  #wireSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  /* the wire hit layer must be invisible to the mouse except on the wires themselves,
     or the svg root swallows every click on empty paper */
  #wireHit{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
  #wireHit path{pointer-events:stroke;cursor:pointer;}
  /* comments are real text boxes: drag them, resize them, type in them */
  .note{position:absolute;font-size:11.5px;color:var(--mid);font-family:var(--sans);line-height:1.55;
        padding:3px 5px;border:1px solid transparent;border-radius:4px;cursor:move;white-space:pre-wrap;
        overflow-wrap:break-word;background:transparent;}
  .note:hover{border-color:var(--line);background:rgba(255,255,255,.75);}
  .note.editing{border-color:var(--live);background:#FFF;cursor:text;white-space:pre-wrap;}
  .note .ngrip{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;cursor:nwse-resize;opacity:0;}
  .note:hover .ngrip{opacity:1;}
  .note .ngrip:after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;
        border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);}
  .colhead{position:absolute;font-family:var(--mono);font-size:11px;color:var(--mid);pointer-events:none;white-space:nowrap;}

  /* ---------- cells ---------- */
  .blk{position:absolute;background:var(--card);border:1px solid var(--ink);border-radius:var(--radius);
       box-shadow:1.5px 1.5px 0 rgba(23,23,26,.07);cursor:grab;user-select:none;}
  .blk.heavy{border-width:1.5px;}
  .blk.dragging{cursor:grabbing;box-shadow:4px 4px 0 rgba(23,23,26,.13);z-index:12;}
  .blk.sel{box-shadow:0 0 0 2px var(--live),1.5px 1.5px 0 rgba(23,23,26,.07);}
  .blk.brush{background:var(--brush);}
  .blk.firing{box-shadow:0 0 0 2px var(--live),0 0 14px rgba(30,102,200,.35);}
  .blk.snapok{box-shadow:0 0 0 2px var(--live);}

  /* line-height matches the row height so the text sits on the optical centre, not a few px low */
  .face{display:flex;align-items:center;justify-content:center;height:var(--faceH);padding:0 7px;
        font-family:var(--mono);font-size:12.5px;line-height:var(--faceH);white-space:nowrap;gap:6px;}
  .face.left{justify-content:flex-start;}
  .face .nm{font-weight:600;}
  .face .bd{color:#2E2C28;}
  .face .lv{color:var(--mid);}
  /* a hairline keeps the live value from reading as part of the expression */
  .face .lv.div{border-left:1px solid var(--line);padding-left:6px;margin-left:-1px;}
  .face .sep{color:var(--faint);}
  .face .argrow{display:inline-flex;align-items:center;gap:5px;}
  .tok{border-radius:3px;padding:0 1px;margin:0 -1px;}
  .tok.hot{background:var(--brush);box-shadow:0 1px 0 var(--live);}
  .nm.hot{background:var(--brush);box-shadow:0 1px 0 var(--live);border-radius:3px;}
  .facein{border:none;background:transparent;font-family:var(--mono);font-size:12.5px;color:var(--ink);padding:0;text-align:center;}
  /* the whole first line, back as the text you typed */
  .sigedit{flex:1;min-width:0;border:none;background:transparent;font-family:var(--mono);font-size:12.5px;
        line-height:var(--faceH);color:var(--ink);padding:0;caret-color:var(--live);}
  [contenteditable]{outline:none;}
  [contenteditable]:focus{background:var(--brush);border-radius:3px;}

  /* argument boxes riding the top border (v0.01 style, restored) */
  .args{position:absolute;top:0;left:0;height:0;}
  /* the border style: the label sits on the edge and its value sits under it, always both */
  .argbox{position:absolute;top:-9px;height:15px;border:1px solid var(--ink);border-radius:3px;background:var(--card);
          font-family:var(--mono);font-size:10px;line-height:13px;text-align:center;color:var(--mid);cursor:text;
          overflow:hidden;white-space:nowrap;z-index:2;}
  .argbox.hot{background:var(--brush);color:var(--ink);}
  .argval{position:absolute;top:8px;height:16px;font-family:var(--mono);font-size:11.5px;line-height:16px;
          text-align:center;color:#2E2C28;pointer-events:none;}
  .argtick{position:absolute;width:1px;background:var(--ink);opacity:.5;}

  /* disclosure sits outside the cell, full cell height, so it lines up with the block it opens */
  .blk{--grip:14px;}
  /* the colour a cell has in the brick scene, so "which box is the blue one" is answerable */
  .blk[data-tint]{border-color:var(--tint);border-width:2px;box-shadow:inset 0 0 0 1px var(--tint), 0 0 0 1px color-mix(in srgb, var(--tint) 30%, transparent);}
  .badge{position:absolute;right:-16px;top:50%;transform:translateY(-50%);width:9px;height:9px;
    border-radius:50%;background:var(--tint);box-shadow:0 0 0 1.5px var(--paper);}
  .blk::before{content:"";position:absolute;inset:-7px;border-radius:calc(var(--radius) + 7px);
    cursor:grab;z-index:0;}
  .blk.dragging::before{cursor:grabbing;}
  .blk > *{position:relative;z-index:1;}
  .grip{position:absolute;left:-15px;top:50%;transform:translateY(-50%);width:11px;height:20px;
    opacity:0;transition:opacity .12s;cursor:grab;z-index:3;
    background-image:radial-gradient(circle,var(--mid) 1.1px,transparent 1.2px);
    background-size:5px 5px;}
  .blk:hover .grip{opacity:.85;}
  .bd[data-edit]{cursor:ns-resize;}
  .bd[data-edit]:focus{cursor:text;}
  .blk.btn{border-color:transparent;background:none;box-shadow:none;}
  .blk.btn .btnface{display:inline-flex;align-items:center;justify-content:center;height:calc(var(--faceH) - 2px);
    padding:0 12px;border:1px solid var(--ink);border-radius:7px;background:linear-gradient(#fff,#eeeade);
    font:600 12.5px var(--sans);color:var(--ink);cursor:pointer;box-shadow:0 1px 0 rgba(31,29,26,.18);
    user-select:none;white-space:nowrap;}
  .blk.btn .btnface:hover{background:var(--wash);}
  .blk.btn .btnface:active{transform:translateY(1px);box-shadow:none;}
  .chev{position:absolute;left:-18px;top:0;width:16px;height:var(--faceH);font-size:15px;color:var(--mid);
        cursor:pointer;text-align:center;line-height:var(--faceH);font-family:var(--mono);user-select:none;}
  .chev:hover{color:var(--ink);}
  /* chrome lives outside the cell, above its top-right corner, and only while you are near it.
     the wrapper is taller than the buttons so the pointer can travel up to them without a gap. */
  .chrome{position:absolute;top:-24px;right:-10px;height:26px;padding-bottom:8px;display:flex;gap:4px;
        align-items:flex-start;opacity:0;pointer-events:none;transition:opacity .1s;z-index:4;}
  .blk:hover .chrome,.blk.sel .chrome,.chrome:hover{opacity:1;pointer-events:auto;}
  .chrome span{width:17px;height:17px;border:1px solid var(--ink);border-radius:50%;background:#FFF;
        display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;
        cursor:pointer;font-family:var(--mono);color:var(--ink);}
  .chrome span:hover{background:var(--ink);color:#FFF;}
  .resz{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:ew-resize;}
  .cmt{position:absolute;left:calc(100% + 7px);top:0;height:var(--faceH);display:flex;align-items:center;
       font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;}
  .blk:hover .cmt{opacity:1;}

  .port{position:absolute;cursor:crosshair;overflow:visible;z-index:2;}

  /* arguments as v0.01 text fields, inline on the cell's first line: name arg arg arg */
  .argf{display:inline-block;min-width:16px;height:17px;line-height:15px;padding:0 4px;
        border:1px solid var(--faint);border-radius:3px;background:#FDFDFA;
        font-family:var(--mono);font-size:11.5px;text-align:center;color:#2E2C28;
        white-space:nowrap;vertical-align:middle;cursor:text;}
  .argf.hot{background:var(--brush);border-color:var(--live);}
  .argf.bare{border-color:transparent;background:transparent;}
  .blk:hover .argf.bare{border-color:var(--line);background:#FDFDFA;}
  /* a hairline from the synapse stem down to the field it fills in */
  .argtie{position:absolute;width:1px;background:var(--ink);opacity:.5;pointer-events:none;}
  .bodyrow{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 12px;font-family:var(--mono);
        font-size:12px;line-height:22px;color:#3A3830;white-space:nowrap;border-top:1px dashed var(--line);}
  .bodyrow .ret{color:var(--sx-key);opacity:.8;}
  /* the answer sits OUTSIDE the box, level with the line that produced it, so a long float
     never widens the cell and the cell never breathes as its number changes */
  .retval{position:absolute;left:calc(100% + 9px);height:22px;line-height:22px;font-family:var(--mono);
        font-size:12px;color:var(--mid);white-space:nowrap;pointer-events:none;}
  .retval:before{content:"\2192  ";color:var(--faint);}
  /* the value under the box: the cell's own width then never flutters with a float's length */
  .undval{position:absolute;left:0;top:100%;margin-top:18px;font-family:var(--mono);font-size:11.5px;
        color:var(--mid);white-space:nowrap;pointer-events:none;padding-left:22px;}
  /* append an argument: appears on hover at the end of the signature */
  .addarg{width:15px;height:15px;border:1px solid var(--faint);border-radius:50%;color:var(--mid);
        font-size:12px;line-height:13px;text-align:center;cursor:pointer;opacity:0;transition:opacity .12s;
        font-family:var(--mono);flex:none;}
  .blk:hover .addarg{opacity:1;}
  .addarg:hover{border-color:var(--ink);color:var(--ink);background:var(--wash);}

  /* bodies */
  .slrow{padding:1px 10px 7px;display:flex;align-items:center;}
  .slrow input{flex:1;min-width:0;width:100%;cursor:grab;}
  .codewrap{padding:0 6px 6px;}
  /* the variables a wire brings in are code, so they sit inside the code, above your lines */
  .bindrow{font-family:var(--mono);font-size:11px;line-height:1.62;padding:6px 8px 0;color:var(--sx-num);
        border-bottom:1px dashed var(--line);margin-bottom:4px;padding-bottom:4px;}
  .bindrow .tok{color:var(--ink);}
  /* the answer the cell hands back, on the line that produces it */
  .coderet{font-family:var(--mono);font-size:11px;line-height:1.62;padding:2px 8px 6px;color:var(--mid);
        border-top:1px dashed var(--line);margin-top:4px;}
  .coderet:before{content:"\2192  ";color:var(--faint);}
  /* syntax colours: GitHub Light, because it is the palette people already read all day */
  :root{ --sx-key:#CF222E; --sx-fn:#8250DF; --sx-str:#0A3069; --sx-num:#0550AE; --sx-com:#59636E; --sx-def:#953800; }
  .kw{color:var(--sx-key);} .fn{color:var(--sx-fn);} .st{color:var(--sx-str);}
  .num{color:var(--sx-num);} .cm{color:var(--sx-com);} .df{color:var(--sx-def);}

  .codebox{border:1px solid var(--line);border-radius:4px;background:#F7F6F2;overflow:hidden;}
  .codebox.scroll{overflow:auto;}
  .codestack{position:relative;}
  /* the highlighted layer and the editable layer share exact metrics and sit on top of each other */
  .codebox pre.hl, .codebox textarea{margin:0;font-family:var(--mono);font-size:11px;line-height:1.62;
        padding:6px 8px;white-space:pre;border:none;letter-spacing:0;tab-size:4;}
  .codebox pre.hl{position:absolute;inset:0;pointer-events:none;color:var(--ink);overflow:hidden;}
  .codebox textarea{display:block;position:relative;width:100%;background:transparent;resize:none;
        color:transparent;caret-color:var(--ink);}
  .codebox textarea::selection{background:#CDE3FA;}
  .codebox .ptr{position:absolute;left:0;height:calc(11px * 1.62);background:rgba(30,102,200,.13);
        border-left:2px solid var(--live);width:100%;pointer-events:none;transition:top .09s linear;display:none;}
  .termbox{margin:0 6px 6px;border-radius:4px;background:#131312;color:#E6E4DA;font-family:var(--mono);
        font-size:11px;line-height:1.6;padding:8px;height:126px;display:flex;flex-direction:column;overflow:hidden;cursor:text;}
  .termbox .tin{display:flex;gap:5px;align-items:center;}
  .termbox input{flex:1;background:transparent;border:none;color:#E6E4DA;font-family:var(--mono);font-size:11px;}
  .lightdot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);flex:none;}
  .meter{height:3px;border-radius:2px;background:var(--line);margin:5px 8px 6px;position:relative;overflow:hidden;}
  .meter i{position:absolute;top:0;bottom:0;left:50%;background:var(--ink);}

  .toast{position:absolute;background:var(--ink);color:var(--paper);font-size:11.5px;font-family:var(--mono);
        padding:4px 10px;border-radius:5px;box-shadow:2px 2px 0 rgba(23,23,26,.14);animation:toastin .16s ease-out;
        pointer-events:none;white-space:nowrap;z-index:20;}
  .ghostin{position:absolute;z-index:15;}
  .ghostin .ring{position:absolute;left:-13px;top:-8px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--mid);
        animation:ringout 3s ease-out infinite;pointer-events:none;}
  .ghostin .gh{position:absolute;top:26px;left:0;font-size:10px;color:var(--faint);font-family:var(--mono);white-space:nowrap;}
  /* the ghost input is dimensionally identical to a real cell face, so text never jumps when the box forms */
  .ghostin .gi{font-family:var(--mono);font-size:12.5px;line-height:var(--faceH);height:var(--faceH);
        border:1px solid var(--faint);border-radius:var(--radius);background:var(--card);color:var(--ink);
        padding:0 7px;min-width:56px;text-align:left;caret-color:var(--live);display:block;}

  /* code-layer (the python side of the morph) */
  .codelayer{position:absolute;inset:0;font-family:var(--mono);font-size:11.5px;line-height:1.62;
        padding:4px 8px;white-space:pre;color:var(--ink);pointer-events:none;overflow:hidden;}
  .codelayer .kw{color:#8A5BB8;} .codelayer .fn{color:#1E66C8;} .codelayer .num{color:#B0562A;}
  .codelayer .cm{color:var(--faint);} .codelayer .st{color:#4C7A4C;}
  .tabhead{position:absolute;font-family:var(--mono);font-size:11px;color:var(--mid);border:1px solid var(--line);
        border-bottom:none;border-radius:5px 5px 0 0;background:#F2F1EC;padding:3px 11px;white-space:nowrap;pointer-events:none;}
  .tabpane{position:absolute;border:1px solid var(--line);border-radius:0 5px 5px 5px;background:#FCFCFA;pointer-events:none;}

  /* ---------- settings drawer ---------- */
  #drawer{position:fixed;top:41px;right:-302px;width:298px;height:calc(100vh - 41px);background:#FCFCFA;
        border-left:1.5px solid var(--ink);z-index:25;transition:right .17s ease;display:flex;flex-direction:column;overflow-y:auto;}
  #drawer.open{right:0;}
  #drawer .dh{display:flex;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;}
  #drawer .dh span{margin-left:auto;cursor:pointer;color:var(--mid);}
  #drawer .sect{padding:11px 15px;border-bottom:1px solid var(--line);}
  #drawer .sect .sh{font-size:9.5px;letter-spacing:.15em;color:var(--mid);font-family:var(--mono);margin-bottom:8px;}
  .optrow{display:flex;gap:4px;flex-wrap:wrap;}

<body>

<script>
'use strict';
/* ============================================================
   codon v0.03
   THREE atoms:  cell . wire . gate
     a value is not an atom: it is a cell that has finished computing.
   TWO rules:    name (a wire with no ink) . nest (cells hold cells)
   ============================================================ */

const S = {
  settings: {
    portStyle:'synapse', wireStyle:'curved', grid:24, snap:true, dots:true, radius:5,
    guides:false, guideW:11, minW:44, showVals:true,
    negStyle:'seesaw',         // seesaw | barbulb | bar | bulb | nc
    bang:'small',              // small | dot | pulse | dashed | off
    gateDir:'vertical',        // vertical | horizontal
    argStyle:'inline',         // inline (v0.01 fields on the face) | border (boxes on the top edge)
    argBorder:'always',        // always | hover
    argShow:'swap',            // name | value | swap (name, and the value while you hover the cell)
    portAlign:'left',          // left | center
    detail:'full',             // full | values (a zoomed-out overview: names and numbers only)
    valuePos:'face',           // face | under (under the box, so cell width never flutters)
    pyModel:'flat',            // flat (straight-line globals, like a spreadsheet) | defs (cells become functions)
    pyLayout:'rows',           // rows | columns
    liveGlow:true, brushing:true, snapWire:true, pyEngine:'mini',
  },
  scene:'hello', nodes:[], edges:[], notes:[], cols:[], zoom:1,
  versions:[], expanded:{},
  sel:null,                    // {kind:'node'|'edge', id} | edge object
  editing:null,                // id of the cell whose first line is open as text
  brush:null,                  // name currently brushed
  morph:0, morphTarget:0,
  drag:null, pending:null, resize:null, pdrag:null, ghost:null, wdrag:null, snapHint:null,
  firing:{},                   // id -> true while a bang is inside the cell
  ptr:null,                    // {id, line} program pointer
};

const $ = id => document.getElementById(id);
const uid = () => 'n' + Math.random().toString(36).slice(2,8);
const G = () => S.settings.grid;
const snap = v => S.settings.snap ? Math.round(v/G())*G() : Math.round(v);
const snapUp = (v,u) => Math.ceil(v/u)*u;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- monospace measurement: the ascii grid ---------- */
const _mc = document.createElement('canvas').getContext('2d');
function tw(s, px, weight){ _mc.font = (weight||400)+' '+(px||12.5)+'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'; return _mc.measureText(String(s)).width; }
const CH = tw('0', 12.5);   // one monospace column

/* ---------- python-ish expressions ---------- */
const FNS = {
  tanh:Math.tanh, exp:Math.exp, log:Math.log, sqrt:Math.sqrt, abs:Math.abs, sin:Math.sin, cos:Math.cos,
  floor:Math.floor, ceil:Math.ceil, pow:Math.pow, min:Math.min, max:Math.max,
  round:(x,d)=>{const k=Math.pow(10,d||0);return Math.round(x*k)/k;},
  relu:x=>Math.max(0,x), sigmoid:x=>1/(1+Math.exp(-x)), len:s=>(s&&s.length)||0,
  sum:a=>Array.isArray(a)?a.reduce((p,c)=>p+c,0):a, int:x=>Math.trunc(Number(x)),
  softmax:a=>{const m=Math.max(...a),e=a.map(v=>Math.exp(v-m)),s=e.reduce((p,c)=>p+c,0);return e.map(v=>v/s);},
};
const KEYWORDS = new Set(['and','or','not','if','else','elif','True','False','None','return','def','in','is',
  'lambda','for','while','import','from','print','range','break','continue','class','pass', ...Object.keys(FNS)]);

function pyToJs(e){
  let s = String(e);
  const m = s.match(/^(.*?)\bif\b(.*?)\belse\b(.*)$/);
  if (m) s = '((' + m[2] + ') ? (' + m[1] + ') : (' + m[3] + '))';
  s = s.replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null');
  s = s.replace(/\band\b/g,'&&').replace(/\bor\b/g,'||').replace(/\bnot\s+/g,'!');
  return s;
}
function freeVars(expr){
  const out=[]; const src=String(expr||'').replace(/(["']).*?\1/g,'""');
  const re=/[A-Za-z_][A-Za-z0-9_]*/g; let m;
  while((m=re.exec(src))){ const t=m[0]; if(!KEYWORDS.has(t) && !out.includes(t)) out.push(t); }
  return out;
}
function evalExpr(expr, scope){
  try{
    const keys = Object.keys(scope).filter(k=>/^[A-Za-z_][A-Za-z0-9_]*$/.test(k) && !FNS[k]);
    const f = new Function(...keys, ...Object.keys(FNS), 'return ('+pyToJs(expr)+');');
    return f(...keys.map(k=>scope[k]), ...Object.values(FNS));
  }catch(e){ return undefined; }
}

/* ---------- the mini interpreter: CS-101 python, offline, from file:// ---------- */
function runMini(body, scope, trace){
  const sc = {...scope};
  const lines = String(body||'').split('\n');
  let out = [], result, steps = 0;
  const t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now ? 0 : 0);
  const overBudget = () => (typeof performance !== 'undefined') && performance.now() - t0 > 200;
  function block(i, indent){                       // returns [value, nextIndex]
    while (i < lines.length){
      if (steps++ > 60000 || overBudget()) return [undefined, lines.length];
      const raw = lines[i], line = raw.trim();
      const ind = raw.length - raw.replace(/^\s*/,'').length;
      if (!line || line.startsWith('#')){ i++; continue; }
      if (ind < indent) return [undefined, i];
      if (trace) trace(i);
      let m;
      if ((m = line.match(/^def\s+([A-Za-z_]\w*)\s*\(([^)]*)\)\s*:$/))){
        const [, fname, plist] = m;
        const ps = plist.split(',').map(s=>s.trim()).filter(Boolean);
        const start = i+1, end = skipBlock(start, ind);
        const src = lines.slice(start, end).join('\n');
        sc[fname] = (...as)=>{ const inner={...sc}; ps.forEach((p,k)=>inner[p]=as[k]); return runMini(src, inner).value; };
        i = end; continue;
      }
      if ((m = line.match(/^(if|elif)\s+(.+):$/))){
        const cond = !!evalExpr(m[2], sc);
        const end = skipBlock(i+1, ind);
        if (cond){ const r = block(i+1, ind+1); if (r[2]) return r; if (r[0]!==undefined) result=r[0];
                   i = skipChain(end, ind); continue; }
        i = end; continue;
      }
      if (line === 'else:'){ const r = block(i+1, ind); if (r[2]) return r; i = skipBlock(i+1, ind); continue; }
      if ((m = line.match(/^for\s+([A-Za-z_]\w*)\s+in\s+(.+):$/))){
        const it = evalRange(m[2], sc); const end = skipBlock(i+1, ind);
        for (const v of it){ sc[m[1]] = v; const r = block(i+1, ind+1); if (r[2]) return r; }
        i = end; continue;
      }
      if ((m = line.match(/^while\s+(.+):$/))){
        const end = skipBlock(i+1, ind); let guard = 0;
        while (evalExpr(m[1], sc) && guard++ < 20000){ const r = block(i+1, ind+1); if (r[2]) return r; }
        i = end; continue;
      }
      if ((m = line.match(/^return\b\s*(.*)$/))) return [m[1] ? evalExpr(m[1], sc) : undefined, i+1, true];
      if ((m = line.match(/^print\s*\((.*)\)$/))){ out.push(fmt(evalExpr(m[1], sc))); i++; continue; }
      if ((m = line.match(/^([A-Za-z_]\w*)\s*(\+|-|\*|\/)?=(?!=)\s*(.+)$/))){
        const cur = sc[m[1]], v = evalExpr(m[3], sc);
        sc[m[1]] = m[2] ? evalExpr('a '+m[2]+' b', {a:cur, b:v}) : v;
        result = sc[m[1]]; i++; continue;
      }
      if ((m = line.match(/^([A-Za-z_]\w*)\.append\s*\((.*)\)$/))){
        if (Array.isArray(sc[m[1]])) sc[m[1]].push(evalExpr(m[2], sc)); i++; continue;
      }
      if (/^(import|from)\b/.test(line)){ i++; continue; }
      result = evalExpr(line, sc); i++;
    }
    return [undefined, i];
  }
  function skipBlock(from, ind){
    let i = from;
    while (i < lines.length){
      const raw = lines[i];
      if (raw.trim()){ const k = raw.length - raw.replace(/^\s*/,'').length; if (k <= ind) break; }
      i++;
    }
    return i;
  }
  function skipChain(from, ind){
    let i = from;
    while (i < lines.length){
      const raw = lines[i], t = raw.trim();
      const k = raw.length - raw.replace(/^\s*/,'').length;
      if (t && k === ind && /^(elif|else)\b/.test(t)){ i = skipBlock(i+1, ind); continue; }
      break;
    }
    return i;
  }
  function evalRange(src, s){
    let m = src.match(/^range\s*\((.+)\)$/);
    if (m){ const a = m[1].split(',').map(x=>Number(evalExpr(x, s))||0);
      const [lo,hi,st] = a.length===1?[0,a[0],1]:a.length===2?[a[0],a[1],1]:a;
      const r=[]; for(let v=lo; st>0? v<hi : v>hi; v+=st) r.push(v); return r; }
    const v = evalExpr(src, s);
    return Array.isArray(v) ? v : typeof v === 'string' ? v.split('') : [];
  }
  const r = block(0, 0);
  return { value: r[0] !== undefined ? r[0] : result, out };
}

/* ---------- pyodide, loaded only when asked for ---------- */
let _pyo = null, _pyoLoading = false;
function loadPyodide_(cb){
  if (_pyo) return cb(_pyo);
  if (_pyoLoading) return setTimeout(()=>loadPyodide_(cb), 400);
  _pyoLoading = true;
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
  s.onload = () => window.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'})
      .then(p => { _pyo = p; _pyoLoading = false; toastAt(24, 60, 'real python ready'); render(); cb(p); })
      .catch(() => { _pyoLoading = false; toastAt(24, 60, 'pyodide failed, staying on mini'); S.settings.pyEngine='mini'; render(); });
  s.onerror = () => { _pyoLoading = false; toastAt(24, 60, 'no network: staying on mini python'); S.settings.pyEngine='mini'; render(); };
  document.head.appendChild(s);
}
function runPy(body, scope){
  if (S.settings.pyEngine === 'real'){
    if (!_pyo){ loadPyodide_(()=>renderLive()); return runMini(body, scope); }
    try{
      const pre = Object.keys(scope).filter(k=>/^[A-Za-z_]\w*$/.test(k))
        .map(k=>k+' = '+JSON.stringify(scope[k] === undefined ? null : scope[k])).join('\n');
      const wrapped = 'def relu(x):\n    return max(0.0, x)\n' + pre + '\ndef __codon():\n' +
        String(body||'').split('\n').map(l=>'    '+l).join('\n') + '\n__codon()';
      return { value: _pyo.runPython(wrapped), out: [] };
    }catch(e){ return { value: undefined, out:[String(e).split('\n').slice(-2)[0]] }; }
  }
  return runMini(body, scope);
}

/* ---------- graph ---------- */
const nodeById = id => S.nodes.find(n=>n.id===id);
function sanitize(s){ const t=String(s).replace(/[^A-Za-z0-9_]/g,'_').replace(/^(\d)/,'_$1'); return t||'_'; }
const byName = () => { const m={}; S.nodes.forEach(n=>{ if(n.name) m[sanitize(n.name)] = n; }); return m; };
const inEdges = id => S.edges.filter(e=>e.t===id).sort((a,b)=>a.tp-b.tp);
const outEdges = id => S.edges.filter(e=>e.f===id);
const edgeKey = e => e.f+'>'+e.t+':'+e.tp;

/* a cell's arg list: declared args, plus one open slot for the next wire */
function argsOf(n){
  if (n.hideArgs) return [];
  const a = (n.args||[]).slice();
  return a;
}
function inCount(n){
  if (n.noIn) return 0;
  if (n.kind === 'gate' || n.kind === 'invert' || n.hideArgs) return 1;
  // a literal keeps one plain socket: that is how a value sits on a feedback cycle and becomes a register
  if (n.kind === 'cell' && n.mode === 'lit') return 1;
  return argsOf(n).length;          // otherwise one synapse per argument, positionally, like pd
}
function outCount(n){ return n.noOut ? 0 : 1; }

/* ---------- evaluation: excel semantics, recalc on change ---------- */
let _stack = new Set(), _memo = {};
function resetEval(){ _stack = new Set(); _memo = {}; }
function valueOf(id){ return _val(id); }
function scopeFor(n, wants){
  const m = {}, nb = byName();
  (wants && wants.length ? wants : Object.keys(nb)).forEach(k=>{
    const nd = nb[k];
    if (nd && nd.id !== n.id && nd.kind !== 'gate') m[k] = _val(nd.id);
  });
  argsOf(n).forEach((a,i)=>{
    const e = S.edges.find(x=>x.t===n.id && x.tp===i);
    if (e){ let v = _val(e.f); if (e.inv) v = invert(v); m[sanitize(a)] = v; }
  });
  if (n.hideArgs){ const e = inEdges(n.id)[0]; if (e){ let v=_val(e.f); if(e.inv) v=invert(v); m.x = v; } }
  return m;
}
function invert(v){
  if (typeof v === 'boolean') return !v;
  if (typeof v === 'number') return -v;
  if (v === undefined) return undefined;
  return !v;
}
function _val(id){
  if (id in _memo) return _memo[id];
  if (_stack.has(id)) return undefined;              // a real cycle updates on a bang, not on recalc
  const n = nodeById(id); if (!n) return undefined;
  _stack.add(id);
  let v;
  switch (n.kind){
    case 'cell': {
      if (n.mode === 'lit'){
        const s = String(n.body).trim();
        if (s === 'True')  { v = true;  break; }
        if (s === 'False') { v = false; break; }
        if (s === '' || s === 'None') { v = undefined; break; }
        if (/^\[.*\]$/.test(s)) { try { v = JSON.parse(s.replace(/'/g,'"')); } catch(_) { v = s; } break; }
        const num = Number(s);
        v = !isNaN(num) ? num : s.replace(/^["'](.*)["']$/,'$1');
        break;
      }
      if (n.mode === 'expr'){ v = evalExpr(n.body, scopeFor(n, freeVars(n.body))); break; }
      if (n.noEval){ v = undefined; break; }   // reading material, not a live cell
      const r = runPy(n.body, scopeFor(n, freeVars(n.body))); n._out = r.out; v = r.value; break;
    }
    case 'gate': {
      const e = inEdges(n.id)[0];
      let x = e ? _val(e.f) : undefined; if (e && e.inv) x = invert(x);
      const sc = scopeFor(n, freeVars(n.body)); sc.x = x;
      const open = n.manual != null ? n.manual : !!evalExpr(n.body, sc);
      n._open = open; v = open ? (x === undefined ? true : x) : undefined; break;
    }
    case 'invert': { const e = inEdges(n.id)[0]; v = e ? invert(_val(e.f)) : undefined; break; }
    case 'watch': case 'say': case 'light': { const e = inEdges(n.id)[0];
      v = e ? (e.inv ? invert(_val(e.f)) : _val(e.f)) : undefined; break; }
    case 'recv': { const sd = S.nodes.find(x=>x.kind==='send' && x.ch===n.ch);
      const e = sd && inEdges(sd.id)[0]; v = e ? _val(e.f) : undefined; break; }
    case 'send': { const e = inEdges(n.id)[0]; v = e ? _val(e.f) : undefined; break; }
    default: v = undefined;
  }
  _stack.delete(id); _memo[id] = v; return v;
}
function fmt(v){
  if (v === undefined || v === null) return '';
  if (typeof v === 'number'){ if (!isFinite(v)) return String(v);
    const r = Math.round(v*1000)/1000; return String(r); }
  if (typeof v === 'boolean') return v ? 'True' : 'False';
  if (Array.isArray(v)) return '[' + v.slice(0,4).map(fmt).join(', ') + (v.length>4?', ...':'') + ']';
  return String(v);
}

/* ============================================================
   layout: the ascii grid. every cell is one typeable line.
   ============================================================ */
const FACE_H = 26, PAD = 7, GAP = 6;

function faceParts(n){
  switch (n.kind){
    case 'cell':
      if (n.mode === 'lit')  return { nm:n.name, bd:String(n.body), edit:'body' };
      // the overview level: just the name and what it currently holds
      if (S.settings.detail === 'values')
        return { nm:n.name, lv:true, quiet:1 };
      // with arguments the first line is the signature and the body folds out underneath,
      // so a cell reads exactly like a def line: h1 x m1 c1 / relu(m1 * x + c1)
      if (n.mode === 'expr') return argsOf(n).length
        ? { nm:n.name, sig:1, row:String(n.body), lv:true }
        : { nm:n.name, bd:String(n.body), edit:'body', lv:true };
      return { nm:n.name, sig:1, lv:true, code:true };
    case 'gate':   return { gate:true, bd:String(n.body), edit:'body' };
    case 'invert': return { seesaw:true, nm:'not', lv:true };
    case 'button': return { btn:true, nm:n.name || 'press' };
    case 'clock':  return { nm:'every', bd:(n.ms/1000)+'s', run:true };
    case 'say':    return { nm:n.name || 'say', bd:n.msg != null ? '"'+n.msg+'"' : '', lv:n.msg == null };
    case 'watch':  return { nm:n.name || 'print', lv:true };
    case 'light':  return { nm:n.name || 'light', light:true };
    case 'send':   return { nm:'send', bd:n.ch };
    case 'recv':   return { nm:'receive', bd:n.ch };
    case 'term':   return { nm:'terminal' };

}
const GATE_W = 44, GATE_VW = 24, LEFT_X = 12;

/* argument fields all sit at the width of a typical number, so nothing jumps as values change */
const fmtShort = v => typeof v === 'number' && isFinite(v)
  ? String(Math.round(v*100)/100) : fmt(v);
let ARG_MIN = 0;
/* what an argument field shows: its name, or the value the wire is currently putting in it */
function argValue(n, i){
  const e = S.edges.find(x=>x.t===n.id && x.tp===i); if (!e) return null;
  let v = _memo[e.f] !== undefined ? _memo[e.f] : valueOf(e.f);
  if (e.inv) v = invert(v);
  const s = fmtShort(v); return s === '' ? null : s;
}
function argLabel(n, i, a){
  const mode = S.settings.argShow;
  if (mode === 'name') return a;
  const v = argValue(n, i);
  if (mode === 'value') return v == null ? a : v;
  return (n._hover && v != null) ? v : a;      // swap: name, and the value while you hover
}
/* arguments live inline on the cell's first line, as v0.01-style text fields */
function argBoxes(n){
  if (S.settings.detail === 'values') return [];   // overview: ports stay, fields go
  if (S.settings.argStyle === 'border') return argBoxesEdge(n);
  const as = argsOf(n); if (!as.length) return [];
  const nm = n.name || '';
  let x = PAD + (nm ? Math.ceil(tw(nm, 12.5, 600)) + GAP : 0);
  const out = [];
  if (!ARG_MIN) ARG_MIN = Math.ceil(tw('-0.04', 11.5)) + 10;
  as.forEach((a,i)=>{
    // width comes from the NAME and a typical number only, never from the live value,
    // otherwise every slider drag rewidths the field and the wires wobble
    const w = Math.max(ARG_MIN, Math.ceil(tw(a, 11.5)) + 10);
    out.push({ name:a, label:argLabel(n, i, a), x, w });
    x += w + 5;
  });

}
const hasArgs = n => argsOf(n).length > 0;
/* inline fields need no lift; the legacy boxes-on-the-border style does */
const portLift = n => (S.settings.argStyle === 'border' && hasArgs(n)) ? 11 : 0;
/* the legacy style: small boxes straddling the top edge */
function argBoxesEdge(n){
  const as = argsOf(n); if (!as.length) return [];
  let x = 7; const out = [];
  as.forEach((a,i)=>{ const label = argLabel(n, i, a);
    const w = Math.max(20, Math.ceil(tw(a, 10.5)) + 12); out.push({ name:a, label, x, w }); x += w + 5; });
  return out;
}
function dims(n){
  const ex = S.settings.detail === 'values' ? false : !!S.expanded[n.id], p = faceParts(n);
  const ab = argBoxes(n);
  let w = PAD*2;
  const bits = [];
  if (p.gate) bits.push(S.settings.gateDir === 'vertical' ? GATE_VW : GATE_W);
  if (p.seesaw) bits.push(SEESAW_W);
  if (p.nm)   bits.push(tw(p.nm, 12.5, 600) + (p.btn ? 22 : 0));
  // the arguments, plus room for the + that appears on hover at the end of the signature
  if (ab.length) bits.push(ab[ab.length-1].x + ab[ab.length-1].w - ab[0].x +
                           (S.settings.argStyle !== 'border' && !p.gate ? 15 + GAP : 0));
  if (p.bd)   bits.push(tw(p.bd, 12.5));
  if (p.light) bits.push(13 + GAP + tw('100%', 11));
  // the live value is hidden inside the box while the body is folded out: it belongs on the
  // return line then, not beside the arguments where it reads like one of them
  const showLive = p.lv && S.settings.showVals && (p.quiet || (S.settings.valuePos === 'face' && !(ex && (p.row || p.code))));
  // reserve at least a typical number's worth, so the box does not breathe on every recalc
  if (showLive){ const s = fmtShort(n._live);
    if (s !== '') bits.push(Math.max(Math.ceil(tw(s, 12.5)), Math.ceil(tw('-0.00', 12.5))) + 12); }
  if (p.run)  bits.push(12);
  w += bits.reduce((a,b)=>a+b, 0) + Math.max(0, bits.length-1)*GAP;
  // a cell can ask for extra width: with several sockets spread across the face, the things
  // feeding them need room to sit side by side without their boxes overlapping
  w = Math.max(w, S.settings.minW, n.minW || 0, 14 + Math.max(inCount(n), outCount(n))*20);
  // the folded-out line is "return <body>". the answer lives outside, so it costs no width.
  if (ex && p.row) w = Math.max(w, 12 + Math.ceil(tw('return ', 12)) + Math.ceil(tw(spaced(p.row), 12)) + 10);
  if (ex){
    if (n.kind === 'cell' && n.mode === 'code') w = Math.max(w, n.wide || 208);
    if (n.kind === 'term') w = Math.max(w, 300);
    if (n.ui === 'slider') w = Math.max(w, 84);   // squarer: a wall of wide sliders reads as clutter
  }
  if (n.wOver) w = Math.max(w, n.wOver);
  w = Math.ceil(w);
  let h = FACE_H;
  if (ex){
    if (p.row) h += 22;                                  // the folded-out body line
    if (n.ui === 'slider') h += 24;
    else if (n.kind === 'cell' && n.mode === 'code'){
      const bl = bindLines(n).length, cl = codeLines(n);
      h += (bl ? bl*17.8 + 12 : 0) + Math.min(cl, n.maxLines || 99)*17.8 + 18
         + (S.settings.showVals ? 22 : 0);
    }
    else if (n.kind === 'light') h += 12;
    else if (n.kind === 'term') h += 134;
  }
  return { w, h:Math.round(h) };
}
const codeLines = n => String(n.body||'').split('\n').length;
/* the text a cell would be typed as: this is what double-click hands back to you */
function sigText(n){
  if (n.kind === 'gate') return 'gate ' + n.body;
  if (n.kind === 'button') return 'button ' + (n.name || 'press');
  if (n.kind === 'say') return 'say ' + (n.msg || '');
  if (n.kind === 'send' || n.kind === 'recv') return n.kind + ' ' + n.ch;
  if (n.kind !== 'cell') return (n.name || n.kind);
  const as = argsOf(n);
  if (as.length) return (n.name || 'f') + ' ' + as.join(' ');
  if (n.mode === 'lit') return (n.name ? n.name + ' ' : '') + n.body;
  return (n.name || 'f') + ' ' + n.body;
}
/* re-read an edited first line back into the cell, keeping its wires where the names line up */
function applySig(n, text){
  const s = String(text).trim(); if (!s) return;
  let m;
  if (n.kind === 'gate'){ n.body = spaced(s.replace(/^gate\s+/, '')); return; }
  if (n.kind === 'button'){ n.name = sanitize(s.replace(/^button\s+/, '')) || 'press'; return; }
  if (n.kind === 'say'){ n.msg = s.replace(/^say\s+/, ''); return; }
  if (n.kind === 'send' || n.kind === 'recv'){ n.ch = sanitize(s.replace(/^\w+\s+/, '')) || 'ping'; return; }
  if ((m = s.match(/^([A-Za-z_]\w*)((?:\s+[A-Za-z_]\w*)*)\s*$/))){
    // name followed by bare identifiers: a def line. arguments follow the words you typed.
    const args = m[2].trim() ? m[2].trim().split(/\s+/) : [];
    n.name = m[1];
    if (args.length){ n.args = args; if (n.mode === 'lit') { n.mode = 'expr'; n.body = n.body || args[0]; } }
    else if (n.mode !== 'code') { n.args = []; }
    return;
  }
  if ((m = s.match(/^([A-Za-z_]\w*)\s*[= ]\s*(.+)$/))){
    n.name = m[1];
    const body = m[2].trim();
    const isLit = /^-?\d*\.?\d+$/.test(body) || /^(True|False|None)$/.test(body) || /^["'].*["']$/.test(body);
    n.mode = isLit ? 'lit' : (n.mode === 'code' ? 'code' : 'expr');
    n.body = isLit ? body : spaced(body);
    return;
  }
  n.body = s;
}
function bindLines(n){
  // a wire into an argument IS the binding. show it as the python it becomes.
  const out = [];
  argsOf(n).forEach((a,i)=>{
    const e = S.edges.find(x=>x.t===n.id && x.tp===i); if (!e) return;
    const src = nodeById(e.f); if (!src) return;
    out.push({ arg:a, src, inv:e.inv, edge:e });

}
/* one synapse per argument, sitting directly above the field it fills in.
   otherwise ports hug the left edge by default, so a column runs as one straight line. */
function portXs(n, k){
  const ab = argBoxes(n);
  if (k === inCount(n) && ab.length === k && k > 0) return ab.map(b => Math.round(b.x + b.w/2));
  if (k <= 0) return [];                       // a source has no socket at all
  const d = n._d || dims(n);
  const base = S.settings.portAlign === 'center' ? Math.round(d.w/2) : LEFT_X;
  if (k === 1) return [base];
  /* Several sockets get the whole width, not a huddle at one corner. Clustered sockets force
     every incoming wire to converge on a 60px span, and that convergence IS the spaghetti: the
     wires have to cross each other to get there. Spread them and the sources can sit directly
     above their own socket, so the wires fall straight down.                                  */
  const pad = LEFT_X, span = Math.max(20*(k-1), d.w - pad*2);
  return Array.from({length:k}, (_,i)=> Math.round(pad + span*i/(k-1)));

/* a gate's ports sit on its two terminals, so the wire runs THROUGH the switch.
   vertical is the default: one straight conductor from the synapse to the axon. */
const gateInX  = () => S.settings.gateDir === 'vertical' ? PAD + 5 : PAD + 5;
const gateOutX = () => S.settings.gateDir === 'vertical' ? PAD + 5 : PAD + 36;

  const d = dims(n); n._d = d;

  const lift = portLift(n);
  const upIn = inLen(lift) - SOCK_CY;             // block top -> socket centre
  const ixs = n.kind === 'gate' ? [gateInX()] : n.kind === 'invert' ? [PAD+5] : portXs(n, ic);
  const oxs = !oc ? []
    : n.kind === 'gate' ? [gateOutX()]
    : n.kind === 'invert' ? [PAD+17]
    : hasArgs(n) ? [ixs[0]]
    : [S.settings.portAlign === 'center' ? Math.round(d.w/2) : LEFT_X];
  return {
    ins:  ixs.map(x=>({x:n.x+x, y:n.y-upIn})),
    outs: oxs.map(x=>({x:n.x+x, y:n.y+d.h+AXON_DROP})),
    inXs:ixs, outXs:oxs, d,
  };
}

/* ---------- ports: four dialects, one meaning ---------- */
/* Drawn as SVG so the geometry is exact: the socket is a semicircle of radius R centred

const SOCK_R = 6.5, SOCK_CY = 6, AXON_R = 3.9, AXON_DROP = 13;
const inLen = L => 19 + (L || 0);            // socket centre sits inLen - SOCK_CY above the block
function portHtml(cx, isIn, plugged, lift){
  const st = S.settings.portStyle;
  if (isIn){
    const H = inLen(lift), cy = SOCK_CY;
    let g = '';
    if (st === 'circle')
      g = '<circle cx="9" cy="'+cy+'" r="5.4" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>'
        + '<line x1="9" y1="'+(cy+5.4)+'" x2="9" y2="'+H+'" stroke="var(--ink)" stroke-width="1.5"/>';
    else if (st === 'pd')
      g = '<rect x="2.5" y="'+(cy-2)+'" width="13" height="4" fill="var(--ink)"/>'
        + '<line x1="9" y1="'+(cy+2)+'" x2="9" y2="'+H+'" stroke="var(--ink)" stroke-width="1" opacity=".55"/>';
    else if (st === 'max')
      g = '<path d="M3,'+(cy-3.5)+' h12 v2 a6,4.5 0 0 1 -12,0 z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>'
        + '<line x1="9" y1="'+(cy+4)+'" x2="9" y2="'+H+'" stroke="var(--ink)" stroke-width="1.5"/>';
    else  // synapse: a clear cup on a stem. the stem starts BELOW the arc, never inside it.
      g = '<path d="M'+(9-SOCK_R)+','+cy+' A'+SOCK_R+','+SOCK_R+' 0 0 0 '+(9+SOCK_R)+','+cy+'" '
        + 'fill="var(--card)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>'
        + '<line x1="9" y1="'+(cy+SOCK_R-0.4)+'" x2="9" y2="'+H+'" stroke="var(--ink)" stroke-width="1.5"/>';
    // a plugged axon is a filled dot at the socket's centre; an inhibited one is a bar instead,
    // because in biology the bar IS the ending and nothing plugs in
    if (plugged === 'bar') g += '<line x1="'+(9-6)+'" y1="'+cy+'" x2="'+(9+6)+'" y2="'+cy+'" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>';
    else if (plugged) g += '<circle cx="9" cy="'+cy+'" r="'+AXON_R+'" fill="var(--ink)"/>';
    return '<svg class="port" style="left:'+(cx-9)+'px;top:'+(-H)+'px;" width="18" height="'+H+'" viewBox="0 0 18 '+H+'">'+g+'</svg>';
  }
  const H = AXON_DROP + AXON_R + 1;
  const g = '<line x1="9" y1="0" x2="9" y2="'+AXON_DROP+'" stroke="var(--ink)" stroke-width="1.5"/>'
          + '<circle cx="9" cy="'+AXON_DROP+'" r="'+AXON_R+'" fill="var(--ink)"/>';
  return '<svg class="port" style="left:'+(cx-9)+'px;top:100%;" width="18" height="'+H+'" viewBox="0 0 18 '+H+'">'+g+'</svg>';
}

/* ---------- the gate glyph: a real circuit switch ----------
   two terminals, a hinged blade, and a dashed control link to the
   condition that actuates it. closed = one continuous conductor.      */
function gateSvg(n){
  const open = n._open === false, man = n.manual != null, H = FACE_H;
  const tip = man ? 'thrown by hand, click to release' : 'click to throw by hand';
  const term = (x,y) => '<circle cx="'+x+'" cy="'+y+'" r="2.7" fill="var(--card)" stroke="var(--ink)" stroke-width="1.4"/>';

  if (S.settings.gateDir === 'vertical'){
    // a ladder rung turned ninety degrees: one conductor straight down through the switch,
    // so the synapse, the blade and the axon all sit on the same vertical line
    const x = 5, yT = 4, yB = H - 4;
    const bx = open ? 19 : x, by = open ? yB - 3 : yB;
    const mx = (x + bx)/2, my = (yT + by)/2;
    return '<svg class="gateglyph" width="'+GATE_VW+'" height="'+H+'" viewBox="0 0 '+GATE_VW+' '+H+'" '+
      'style="flex:none;overflow:visible;cursor:pointer;" title="'+tip+'">'+
      '<line x1="'+x+'" y1="-4" x2="'+x+'" y2="'+yT+'" stroke="var(--ink)" stroke-width="1.5"/>'+
      '<line x1="'+x+'" y1="'+yB+'" x2="'+x+'" y2="'+(H+4)+'" stroke="var(--ink)" stroke-width="1.5"/>'+
      '<line x1="'+x+'" y1="'+yT+'" x2="'+bx+'" y2="'+by+'" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round"/>'+
      term(x, yT) + term(x, yB) +
      // the control link leaves the blade and points straight at the condition beside it
      '<path d="M'+(mx + 2)+','+(my + 1)+' L'+(GATE_VW + 1)+','+(H/2)+'" fill="none" '+
        'stroke="var(--ink)" stroke-width="1.1" stroke-dasharray="1.8 2" opacity="'+(man?1:.9)+'"/>'+
      (man ? '<rect x="'+(mx - 1.5)+'" y="'+(my - 1.5)+'" width="5" height="5" fill="var(--ink)"/>' : '')+
      '</svg>';
  }
  const y = 15, x1 = 5, x2 = 36;
  const bx = open ? 31 : x2, by = open ? 5 : y;
  return '<svg class="gateglyph" width="'+GATE_W+'" height="'+H+'" viewBox="0 0 '+GATE_W+' '+H+'" '+
    'style="flex:none;overflow:visible;cursor:pointer;" title="'+tip+'">'+
    '<line x1="'+x1+'" y1="-3" x2="'+x1+'" y2="'+y+'" stroke="var(--ink)" stroke-width="1.4"/>'+
    '<line x1="'+x2+'" y1="'+y+'" x2="'+x2+'" y2="'+(H+3)+'" stroke="var(--ink)" stroke-width="1.4"/>'+
    '<line x1="'+x1+'" y1="'+y+'" x2="'+bx+'" y2="'+by+'" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>'+
    term(x1, y) + term(x2, y) +
    '<path d="M20,'+(open?9:y-2)+' L20,4 L'+(GATE_W+3)+',4" fill="none" stroke="var(--ink)" stroke-width="1" '+
      'stroke-dasharray="1.7 1.9" opacity="'+(man?1:.85)+'"/>'+
    (man ? '<rect x="17.5" y="'+(open?11:y-4)+'" width="5" height="5" fill="var(--ink)"/>' : '')+
    '</svg>';
}

/* the inverter molecule wears the same see-saw the inhibiting wire does, standing upright
   like the gate: what comes in on the top pushes one end down and lifts the other. */
const SEESAW_W = 26;
function seesawSvg(){
  const H = FACE_H, x = 5, piv = H/2;

    '<line x1="'+x+'" y1="-4" x2="'+x+'" y2="'+(piv-6)+'" stroke="var(--ink)" stroke-width="1.5"/>'+
    '<line x1="'+(x+12)+'" y1="'+(piv+6)+'" x2="'+(x+12)+'" y2="'+(H+4)+'" stroke="var(--ink)" stroke-width="1.5"/>'+
    '<line x1="'+(x-1)+'" y1="'+(piv-6)+'" x2="'+(x+13)+'" y2="'+(piv+6)+'" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>'+
    '<path d="M'+(x+2.8)+','+(piv+4)+' L'+(x+6)+','+piv+' L'+(x+9.2)+','+(piv+4)+' Z" fill="var(--ink)"/>'+
    '<path d="M'+(x-1)+','+(piv-6)+' l-2,1.4 l4,1.4 l-4,1.4 l2,1.4" fill="none" stroke="var(--ink)" stroke-width="1" opacity=".85"/>'+

/* ---------- wires ---------- */
/* Subway routing: only vertical, horizontal and 45 degrees, with a fixed leader off each port.
   A wire that has to go back up is taken out to the side and up cleanly, never underneath a cell. */
const LEAD = 9;                               // a fixed straight leader off every port
function wirePath(x1,y1,x2,y2,style,lane){
  const dx = x2-x1, dy = y2-y1, adx = Math.abs(dx), sx = Math.sign(dx) || 1;
  if (style === 'curved')   return 'M'+x1+','+y1+' C'+x1+','+(y1+55)+' '+x2+','+(y2-55)+' '+x2+','+y2;
  if (style === 'straight') return 'M'+x1+','+y1+' L'+x2+','+y2;
  if (style === 'stepped')  return 'M'+x1+','+y1+' L'+x1+','+((y1+y2)/2)+' L'+x2+','+((y1+y2)/2)+' L'+x2+','+y2;

  const P = (...pts) => 'M' + pts.map(p=>p[0]+','+p[1]).join(' L');
  if (adx < 1.5) return P([x1,y1],[x2,y2]);

  // backwards: drop, cross to a clear side lane, climb it, come back in, drop into the socket
  if (dy < 12){
    const L = lane != null ? lane : Math.max(x1, x2) + 52;
    const yA = y1 + 16, yB = y2 - 16, k = 10;
    const a = Math.sign(L - x1) || 1, b = Math.sign(x2 - L) || 1;
    return P([x1,y1],[x1,yA-k],[x1+a*k,yA],[L-a*k,yA],[L,yA-k],[L,yB+k],[L+b*k,yB],[x2-b*k,yB],[x2,yB+k],[x2,y2]);
  }
  const run = dy - 2*LEAD;                    // vertical room available for the 45 degree part
  if (run >= adx){                            // down, one clean diagonal, down
    const v = (run - adx)/2;
    return P([x1,y1],[x1,y1+LEAD+v],[x2,y1+LEAD+v+adx],[x2,y2]);
  }
  // not enough height for a single diagonal: two 45s with a horizontal between them
  const r = run/2;
  return P([x1,y1],[x1,y1+LEAD],[x1+sx*r,y1+LEAD+r],[x2-sx*r,y1+LEAD+r],[x2,y2-LEAD],[x2,y2]);
}

function edgeStyle(e){

  let width = 1.4, op = .85, dash = null;
  if (S.settings.wireWeight && v !== null) width = clamp(0.9 + Math.abs(v)*1.5, 0.9, 2*AXON_R - 0.6);
  const f = nodeById(e.f);
  if (f && f.kind === 'gate' && f._open === false){ op = .35; dash = '3 5'; }
  if (S.brush && brushHit(e)) return { stroke:'var(--live)', width:Math.max(width,2), op:1, dash };
  return { stroke:'var(--ink)', width, op, dash };

  if (!S.brush) return false;

/* Two different things, drawn differently:

  const bar = (d, half, w) => { const a = at(d,-half), b = at(d,half);
    return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+stroke+'" stroke-width="'+(w||2.4)+'" stroke-linecap="round"/>'; };

          + '<path d="M'+(piv[0]-3.2)+','+(piv[1]+3.4)+' L'+piv[0]+','+piv[1]+' L'+(piv[0]+3.2)+','+(piv[1]+3.4)+' Z" fill="'+stroke+'"/>'

    if (selected){

      const mx = (o.x+i.x)/2, my = (o.y+i.y)/2;
      svg += '<g data-edgex="'+key+'" style="cursor:pointer">'+
        '<circle cx="'+mx+'" cy="'+my+'" r="9" fill="var(--card)" stroke="var(--live)" stroke-width="1.4"/>'+
        '<path d="M'+(mx-3)+','+(my-3)+' l6,6 M'+(mx+3)+','+(my-3)+' l-6,6" stroke="var(--live)" stroke-width="1.5" stroke-linecap="round"/></g>';
    }
    hit += '<path data-hit="'+key+'" d="'+d+'" fill="none" stroke="transparent" stroke-width="12"/>';
  });
  if (S.pending) svg += '<path d="M'+S.pending.x1+','+S.pending.y1+' L'+S.pending.mx+','+S.pending.my+'" fill="none" stroke="var(--mid)" stroke-width="1.4" stroke-dasharray="4 4"/>';
  if (S.snapHint) svg += '<circle cx="'+S.snapHint.x+'" cy="'+S.snapHint.y+'" r="9" fill="none" stroke="var(--live)" stroke-width="1.6"/>';
  svg += '<g id="pulses"></g>';
  $('wireSvg').innerHTML = svg;
  $('wireHit').innerHTML = hit;
}

/* ---------- bang: a real bit travelling the wire ---------- */
const _pulses = [];
let _live_edges = {}, _rafOn = false;
const PULSE_MS = 150;                        // fast: the wire lights at once, the bit just catches up
function firePulse(e, delay){
  if (S.settings.bang === 'off') return;
  const key = edgeKey(e);
  _pulses.push({ key, t0: performance.now() + (delay||0), dur: PULSE_MS });
  _live_edges[key] = true;                   // light the wire immediately, before the dot moves
  if (S.settings.liveGlow) renderWires();
  if (!_rafOn){ _rafOn = true; requestAnimationFrame(tickPulses); }
}
/* a slider being dragged is a stream of events, so it streams dots, throttled to the frame rate */
let _streamAt = 0;
function streamFrom(id){
  const now = performance.now();
  if (now - _streamAt < 90) return;
  _streamAt = now;
  outEdges(id).forEach(e=>{
    const src = nodeById(e.f);
    if (src && src.kind === 'gate' && src._open === false) return;
    firePulse(e, 0);
    const t = nodeById(e.t); if (t) setTimeout(()=>streamFrom(t.id), PULSE_MS);
  });
}
function tickPulses(now){
  const g = $('pulses');
  if (!g){ _rafOn = false; return; }
  let html = '', alive = false; const nextLive = {};
  for (let i = _pulses.length-1; i >= 0; i--){
    const p = _pulses[i];
    if (now < p.t0){ alive = true; nextLive[p.key] = true; continue; }
    const t = (now - p.t0) / p.dur;
    if (t >= 1){ _pulses.splice(i,1); continue; }
    alive = true; nextLive[p.key] = true;
    const path = document.querySelector('[data-edge="'+p.key+'"]');
    if (!path) { _pulses.splice(i,1); continue; }
    const L = path.getTotalLength(), pt = path.getPointAtLength(L * t);
    const b = S.settings.bang;
    if (b === 'small')
      html += '<circle cx="'+pt.x+'" cy="'+pt.y+'" r="3" fill="var(--ink)"/>';
    else if (b === 'dot')
      html += '<circle cx="'+pt.x+'" cy="'+pt.y+'" r="4.2" fill="var(--live)"/>' +
              '<circle cx="'+pt.x+'" cy="'+pt.y+'" r="'+(4.2 + 7*(1-Math.abs(0.5-t)*2))+'" fill="var(--live)" opacity=".18"/>';
    else if (b === 'pulse')
      html += '<circle cx="'+pt.x+'" cy="'+pt.y+'" r="'+(3+9*t)+'" fill="none" stroke="var(--live)" stroke-width="1.6" opacity="'+(1-t)+'"/>';
    else if (b === 'dashed'){
      const seg = Math.max(14, L*0.22), off = -(t*L*1.6 % 28);
      html += '<path d="'+path.getAttribute('d')+'" fill="none" stroke="var(--live)" stroke-width="2.4" '+
              'stroke-dasharray="'+seg+' '+seg+'" stroke-dashoffset="'+off+'" opacity=".85"/>';
    }
  }
  g.innerHTML = html;
  const changed = Object.keys(nextLive).join() !== Object.keys(_live_edges).join();
  _live_edges = nextLive;
  if (changed && S.settings.liveGlow) renderWires();
  if (alive) requestAnimationFrame(tickPulses); else { _rafOn = false; g.innerHTML = ''; if (S.settings.liveGlow) renderWires(); }
}
function bang(id, depth){
  const d = depth || 0; if (d > 14) return;
  const outs = outEdges(id);
  outs.forEach(e=>{
    const t = nodeById(e.t); if (!t) return;
    const src = nodeById(e.f);
    if (src && src.kind === 'gate' && src._open === false) return;   // a shut gate stops the bit
    firePulse(e, 0);
    setTimeout(()=>{
      flashBlock(t.id);
      void 0;
      if (t.kind === 'say') toast(t, t.msg != null ? t.msg : fmt(valueOf(t.id)));
      else if (t.kind === 'send') S.nodes.filter(x=>x.kind==='recv' && x.ch===t.ch).forEach(r=>{ flashBlock(r.id); bang(r.id, d+1); });
      else if (t.kind === 'cell' && t.mode === 'lit'){
        const s = inEdges(t.id).map(x=>x.f).find(f=>nodeById(f) && nodeById(f).kind !== 'button');
        if (s){ t.body = fmt(valueOf(s)); renderLive(); }
        bang(t.id, d+1);
      }
      else if (t.kind === 'gate'){ resetEval(); valueOf(t.id); if (t._open !== false) bang(t.id, d+1); }
      else bang(t.id, d+1);
    }, PULSE_MS);
  });
}
function flashBlock(id){
  const el = document.querySelector('[data-blk="'+id+'"]'); if (!el) return;
  el.classList.add('firing'); setTimeout(()=>el.classList.remove('firing'), 300);
}
function toast(n, msg){ toastAt(n.x + 8, n.y - 32, msg); }
function toastAt(x, y, msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  el.style.left = x+'px'; el.style.top = y+'px';
  $('overlay').appendChild(el); setTimeout(()=>el.remove(), 1800);
}
const _timers = {};
function syncClocks(){
  S.nodes.filter(n=>n.kind==='clock').forEach(n=>{
    if (n.on && !_timers[n.id]) _timers[n.id] = setInterval(()=>{ flashBlock(n.id); bang(n.id); }, n.ms || 1000);
    if (!n.on && _timers[n.id]){ clearInterval(_timers[n.id]); delete _timers[n.id]; }
  });
  Object.keys(_timers).forEach(id=>{ if (!nodeById(id)){ clearInterval(_timers[id]); delete _timers[id]; } });
}

/* ============================================================
   brushing: hover a name, every place it lives lights up.
   (excel's linked cells; the lab's knob/equation/code brushing)
   ============================================================ */
function tokenize(text, cls){
  // wrap identifiers so they can be brushed, leave everything else literal
  const s = String(text == null ? '' : text);
  let out = '', i = 0;
  const re = /[A-Za-z_][A-Za-z0-9_]*|"[^"]*"|'[^']*'|#[^\n]*/g;
  let m;
  while ((m = re.exec(s))){
    out += esc(s.slice(i, m.index));
    const t = m[0];
    if (/^[A-Za-z_]/.test(t) && !KEYWORDS.has(t))
      out += '<span class="tok'+(cls?' '+cls:'')+'" data-tok="'+esc(t)+'">'+esc(t)+'</span>';
    else out += esc(t);
    i = m.index + t.length;
  }
  return out + esc(s.slice(i));
}
function applyBrush(){
  const b = S.brush;
  document.querySelectorAll('.tok.hot,.nm.hot,.argbox.hot,.blk.brush').forEach(el=>{
    el.classList.remove('hot'); el.classList.remove('brush');
  });
  if (!b || !S.settings.brushing) return;
  document.querySelectorAll('[data-tok="'+CSS.escape(b)+'"]').forEach(el=>el.classList.add('hot'));
  document.querySelectorAll('[data-name]').forEach(el=>{ if (el.dataset.name === b) el.classList.add('hot'); });
  document.querySelectorAll('[data-argname]').forEach(el=>{ if (el.dataset.argname === b) el.classList.add('hot'); });
  const home = S.nodes.find(n=>sanitize(n.name||'') === b);
  if (home){ const el = document.querySelector('[data-blk="'+home.id+'"]'); if (el) el.classList.add('brush'); }
}
var setBrush = function(name){
  if (S.brush === name) return;
  S.brush = name; applyBrush(); renderWires();
};

/* ============================================================
   the python projection. every cell reads as one straight line.
   a wire IS the substitution of an argument by its source's name.
   ============================================================ */
/* an inhibitory wire is the minus sign. on a boolean it reads "not"; on a number it reads "-". */
function invPrefix(src){
  const v = _memo[src.id] !== undefined ? _memo[src.id] : valueOf(src.id);
  return typeof v === 'number' ? '-' : 'not ';
}
function subst(body, n){
  let s = String(body || '');
  argsOf(n).forEach((a,i)=>{
    const e = S.edges.find(x=>x.t===n.id && x.tp===i); if (!e) return;
    const src = nodeById(e.f); if (!src || !src.name) return;
    const rep = (e.inv ? invPrefix(src) : '') + sanitize(src.name);
    s = s.replace(new RegExp('\\b'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g'), rep);
  });
  return s;
}
/* ---------- the scoping rule ----------
   One page is one namespace, the way one spreadsheet is one namespace. Every cell's name is a
   global; a wire into an argument slot means "put that name here". So a neuron whose body reads
   relu(m * x + c) with dose wired into x emits, plainly:

       h1 = relu(m1 * dose + c1)

   That is the whole model. There is no make_h1, no hidden scope, and nothing a novice has to
   hold in their head that they cannot see on the canvas. The parameters hang off the neuron in
   the picture and sit above it in the code, and the two read the same.

   Columns arrange the page; they do not scope it. y in one column and y in another are the same
   y. Set python model to "defs" in settings if you would rather see argument-taking cells become
   real functions -- correct, but a bigger idea than a first program needs.                    */
function pyOf(n){
  const nm = sanitize(n.name || n.kind);
  const defs = S.settings.pyModel === 'defs';   // off by default: see the note above pyModel
  switch (n.kind){
    case 'cell': {
      if (n.mode === 'lit')  return nm + ' = ' + String(n.body).trim();
      if (n.mode === 'expr'){
        if (defs && argsOf(n).length){
          // the function that makes it is make_foo; the value it made is foo. no shadowing,
          // and a reader can see at a glance which is the recipe and which is the result.
          const call = argsOf(n).map((a,i)=>{
            const e = S.edges.find(x=>x.t===n.id && x.tp===i), src = e && nodeById(e.f);
            return (e && e.inv ? invPrefix(src) : '') + (src ? sanitize(src.name||'x') : a);
          }).join(', ');
          return 'def make_' + nm + '(' + argsOf(n).join(', ') + '):\n    return ' + spaced(n.body) +
                 '\n\n' + nm + ' = make_' + nm + '(' + call + ')';
        }
        return nm + ' = ' + subst(n.body, n);
      }
      const lines = [];
      bindLines(n).forEach(b=>{ lines.push(sanitize(b.arg) + ' = ' + (b.inv?'-':'') + sanitize(b.src.name || 'x')); });
      String(n.body||'').split('\n').forEach(l=>{
        const m = l.match(/^(\s*)return\s+(.+)$/);
        lines.push(m && !/^\s{4,}/.test(l) ? nm + ' = ' + m[2] : l);
      });
      return lines.join('\n');
    }
    case 'gate': {
      const e = inEdges(n.id)[0], src = e && nodeById(e.f);
      const val = src ? sanitize(src.name || 'x') : 'x';
      return 'if ' + spaced(n.body) + ':\n    ' + nm + ' = ' + val;
    }
    case 'button': return '# ' + (n.name || 'press') + ': you press it';
    case 'clock':  return '# every ' + (n.ms/1000) + 's: a source that fires itself';
    case 'say':    { const e = inEdges(n.id)[0], src = e && nodeById(e.f);
      return 'print(' + (n.msg != null ? JSON.stringify(n.msg) : (src ? sanitize(src.name||'x') : '')) + ')'; }
    case 'watch':  { const e = inEdges(n.id)[0], src = e && nodeById(e.f);
      return 'print(' + (src ? sanitize(src.name||'x') : '') + ')'; }
    case 'light':  { const e = inEdges(n.id)[0], src = e && nodeById(e.f);
      return 'set_brightness(' + (src ? sanitize(src.name||'x') : '0') + ')'; }
    case 'send':   { const e = inEdges(n.id)[0], src = e && nodeById(e.f);
      return sanitize(n.ch) + ' = ' + (src ? sanitize(src.name||'x') : 'None'); }
    case 'invert': { const e = inEdges(n.id)[0], src = e && nodeById(e.f);
      return nm + ' = ' + (src ? (typeof _memo[src.id] === 'number' ? '-' : 'not ') + sanitize(src.name||'x') : 'not x'); }
    case 'recv':   return '# ' + sanitize(n.ch) + ': a wire with no ink';
    case 'term':   return '# terminal';
  }
  return '';
}
function spaced(s){
  // good coding practice: breathing room around operators
  return String(s)
    .replace(/\s*(<=|>=|==|!=|\+=|-=|\*\*|\/\/)\s*/g, ' $1 ')
    .replace(/\s*([<>+\-*\/%])\s*/g, (m,op,off,str)=>{
      const before = str.slice(0, off).trim();
      if (op === '-' && (before === '' || /[([,=<>+\-*\/%]$/.test(before))) return '-';   // unary
      return ' ' + op + ' ';
    })
    .replace(/\s*,\s*/g, ', ')
    .replace(/\(\s+/g, '(').replace(/\s+\)/g, ')')
    .replace(/ {2,}/g, ' ')
    .replace(/\* \*/g, '**')
    .trim();
}
/* a single left-to-right tokeniser, so a string containing "def" is never recoloured */
const PY_KW = /^(def|class|return|if|else|elif|for|while|in|is|not|and|or|import|from|as|with|try|except|finally|lambda|pass|break|continue|global|yield|True|False|None|self)$/;
const PY_FN = /^(relu|tanh|sigmoid|exp|log|sqrt|abs|min|max|round|sum|len|range|softmax|print|enumerate|sorted|set|list|dict|str|int|float|open|random|append)$/;
function pyHighlight(src){
  const s = String(src == null ? '' : src);
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\bf?["'])|(\b\d[\d_]*\.?\d*(?:e-?\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = '', i = 0, m;
  while ((m = re.exec(s))){
    out += esc(s.slice(i, m.index));
    const t = m[0];
    if (m[1])      out += '<span class="cm">' + esc(t) + '</span>';
    else if (m[2]) out += '<span class="st">' + esc(t) + '</span>';
    else if (m[4]) out += '<span class="num">' + esc(t) + '</span>';
    else if (m[5]){
      const after = s.slice(m.index + t.length);
      // identifiers carry data-tok so hovering a name lights it up in the python view too
      const tok = ' data-tok="' + esc(t) + '"';
      if (PY_KW.test(t))      out += '<span class="kw">' + esc(t) + '</span>';
      else if (PY_FN.test(t)) out += '<span class="fn">' + esc(t) + '</span>';
      else if (/^\s*\(/.test(after) || /\bdef\s+$/.test(s.slice(0, m.index)))
                              out += '<span class="df tok"' + tok + '>' + esc(t) + '</span>';
      else                    out += '<span class="tok"' + tok + '>' + esc(t) + '</span>';
    }
    else out += esc(t);
    i = m.index + t.length;
  }
  return out + esc(s.slice(i));
}

/* ---------- columns: a column is a file; at full python it is a tab ---------- */
/* a column is a file. scenes name theirs; hand-drawn graphs get buckets by x. */
function columns(){
  const map = {};
  const explicit = S.nodes.some(n=>n.col);
  if (explicit){
    S.nodes.forEach(n=>{ const k = n.col || 'main'; (map[k] = map[k] || []).push(n); });
    const named = (S.cols || []).filter(k=>map[k]);
    const rest = Object.keys(map).filter(k=>!named.includes(k));
    return named.concat(rest).map((k,i)=>({ i, name:k, nodes:map[k].sort((a,b)=>a.y-b.y) }));
  }
  const BW = 300;
  S.nodes.forEach(n=>{ const k = Math.floor(n.x / BW); (map[k] = map[k] || []).push(n); });
  return Object.keys(map).map(Number).sort((a,b)=>a-b).map((k,i)=>({
    i, name:(S.cols && S.cols[i]) || ('col'+(i+1)), nodes:map[k].sort((a,b)=>a.y-b.y),
  }));
}
const LH = 18.6;
function codeLayout(){
  const cols = columns();
  const gapX = 22, gapY = 34, padX = 34, padY = 74;
  // how wide the viewport is, so the columns can wrap into rows instead of running off screen
  const avail = Math.max(560, (wrap ? wrap.clientWidth : 1100) / (S.zoom || 1) - padX*2);
  const measured = cols.map(c=>{
    let wide = 190;
    c.nodes.forEach(n=>{ String(pyOf(n)).split('\n').forEach(l=>{ wide = Math.max(wide, tw(l, 11.5) + 26); }); });
    return Math.min(Math.max(wide, 200), 460);
  });
  const out = { nodes:{}, cols:[] };
  let x = padX, rowTop = padY, rowBottom = padY;
  cols.forEach((c,ci)=>{
    const wide = measured[ci];
    if (S.settings.pyLayout === 'rows' && ci > 0 && x + wide > padX + avail){
      x = padX; rowTop = rowBottom + gapY; rowBottom = rowTop;    // wrap to the next row
    }
    let y = rowTop;
    c.nodes.forEach(n=>{
      const ls = String(pyOf(n)).split('\n').length;
      out.nodes[n.id] = { x, y, w:wide, h: ls*LH + 6 };
      y += ls*LH + 6;
    });
    out.cols.push({ x, y0: rowTop, y1: y, w: wide, name: c.name });
    rowBottom = Math.max(rowBottom, y);
    x += wide + gapX;
  });
  return out;
}

/* ============================================================
   rendering
   ============================================================ */
function blockHtml(n){
  const ex = S.settings.detail === 'values' ? false : !!S.expanded[n.id], d = dims(n), pp = portPos(n), p = faceParts(n);
  const heavy = (n.kind === 'cell' && n.mode === 'code') || n.kind === 'term';
  // an expr cell folds out to show the line it computes -- that IS its code, and a chevron that
  // refuses to open on the one cell you want to read is worse than no chevron
  const canEx = (n.kind === 'cell' && (n.mode === 'code' || n.mode === 'expr'))
             || n.kind === 'term' || n.ui === 'slider' || n.kind === 'light';
  const ab = argBoxes(n);
  let inner = '<div class="vizlayer" data-viz="'+n.id+'">';

  /* double-click turns the whole first line back into the text you typed, which is the only
     honest way to rename: you edit the source, not a widget. */
  if (S.editing === n.id){
    inner += '<div class="face left"><input class="sigedit" data-sigedit="'+n.id+'" spellcheck="false" value="'+esc(sigText(n))+'"></div>';
    if (ex && p.row) inner += '<div class="bodyrow"><span class="ret">return</span><span class="bd">'+tokenize(spaced(p.row))+'</span></div>';
    inner += '</div><div class="codelayer" data-code-layer="'+n.id+'" style="opacity:0;"></div>';
    return '<div class="blk sel" data-blk="'+n.id+'" style="left:'+n.x+'px;top:'+n.y+'px;width:'+d.w+'px;height:'+d.h+'px;">'+inner+'</div>';
  }

  /* face: one aligned monospace line. a cell with arguments reads as its signature. */
  const bare = S.settings.argBorder === 'hover' ? ' bare' : '';
  const argf = (b,i)=> '<span class="argf'+bare+'" data-argname="'+esc(b.name)+'" data-arg="'+n.id+':'+i+'" '+
        'contenteditable="true" spellcheck="false" style="width:'+b.w+'px;">'+esc(b.label)+'</span>';
  const inline = S.settings.argStyle !== 'border';
  inner += '<div class="face'+((p.gate || p.sig || p.seesaw) ? ' left' : '')+'">';
  if (p.gate) inner += gateSvg(n);
  if (p.seesaw) inner += seesawSvg();
  if (p.nm)   inner += p.btn
    ? '<span class="btnface" data-fire="'+n.id+'" data-name="'+esc(sanitize(n.name||''))+'">'+esc(p.nm)+'</span>'
    : '<span class="nm" data-name="'+esc(sanitize(n.name||''))+'">'+esc(p.nm)+'</span>';
  if (inline && ab.length) inner += '<span class="argrow">'+ab.map(argf).join('')+'</span>';
  if (p.edit) inner += '<span class="bd" data-edit="'+n.id+'" contenteditable="true" spellcheck="false">'+
                       (n.mode === 'lit' ? esc(String(n.body)) : tokenize(spaced(n.body)))+'</span>';
  else if (p.bd) inner += '<span class="bd">'+esc(p.bd)+'</span>';
  if (inline && ab.length && !p.gate)
    inner += '<span class="addarg" data-addarg="'+n.id+'" title="add an argument">+</span>';
  if (p.light) inner += '<span class="lightdot" data-light="'+n.id+'"></span><span class="lv" data-lightpct="'+n.id+'"></span>';
  const showLive = p.lv && S.settings.showVals && (p.quiet || (S.settings.valuePos === 'face' && !(ex && (p.row || p.code))));
  if (showLive) inner += '<span class="lv'+((p.bd||p.code||p.sig)?' div':'')+'" data-live="'+n.id+'">'+esc(fmtShort(n._live))+'</span>';
  if (p.run)  inner += '<span class="lv" data-clock="'+n.id+'" style="cursor:pointer;">'+(n.on?'stop':'run')+'</span>';
  inner += '</div>';

  /* legacy option: the same fields straddling the top edge, with a tie down to each */
  if (!inline && ab.length){
    inner += '<div class="args">'+ab.map((b,i)=>{
      const v = argValue(n, i);
      return '<div class="argbox" data-argname="'+esc(b.name)+'" data-arg="'+n.id+':'+i+'" contenteditable="true" '+
        'spellcheck="false" style="left:'+b.x+'px;width:'+b.w+'px;">'+esc(b.name)+'</div>'+
        '<div class="argval" style="left:'+b.x+'px;width:'+b.w+'px;">'+esc(v == null ? '' : v)+'</div>';
    }).join('')+'</div>';
  }
  /* a hairline from each synapse stem down onto the field it fills in */
  if (inline && ab.length) inner += ab.map(b=>
    '<span class="argtie" style="left:'+Math.round(b.x + b.w/2)+'px;top:0;height:5px;"></span>').join('');

  /* the body, folded out under the signature, with the answer on the line that produces it */
  if (ex && p.row)
    inner += '<div class="bodyrow"><span class="ret">return</span>'+
             '<span class="bd" data-edit="'+n.id+'" contenteditable="true" spellcheck="false">'+
             tokenize(spaced(p.row))+'</span></div>';

  /* bodies */
  if (ex && n.ui === 'slider')
    inner += '<div class="slrow"><input type="range" data-slider="'+n.id+'" min="'+n.min+'" max="'+n.max+'" step="'+n.step+'" value="'+(parseFloat(n.body)||0)+'"></div>';
  if (ex && n.kind === 'light')
    inner += '<div class="meter"><i data-meter="'+n.id+'"></i></div>';
  if (ex && n.kind === 'cell' && n.mode === 'code'){
    const bl = bindLines(n);
    const scroll = n.maxLines && codeLines(n) > n.maxLines;
    inner += '<div class="codewrap">';
    inner += '<div class="codebox'+(scroll?' scroll':'')+'"'+(scroll?' style="max-height:'+(n.maxLines*17.8+12)+'px"':'')+'>';
    // whatever is wired in arrives as a variable, and that IS code, so it lives in the code
    if (bl.length) inner += '<div class="bindrow" data-bind-of="'+n.id+'">'+bl.map(b=>
      '<span class="tok" data-tok="'+esc(sanitize(b.arg))+'">'+esc(b.arg)+'</span>'+
      ' = <span class="val num">'+esc(fmtShort(valueOf(b.edge.f)))+'</span>'+
      '<span class="cm">   # from '+esc(b.src.name || b.src.kind)+'</span>').join('<br>')+'</div>';
    inner += '<div class="codestack">'+
      '<div class="ptr" data-ptr="'+n.id+'"></div>'+
      '<pre class="hl" data-hl="'+n.id+'" aria-hidden="true">'+pyHighlight(n.body||'')+'</pre>'+
      '<textarea data-code="'+n.id+'" rows="'+codeLines(n)+'" spellcheck="false" wrap="off">'+esc(n.body||'')+'</textarea></div>';
    if (S.settings.showVals) inner += '<div class="coderet" data-live="'+n.id+'">' + esc(fmtShort(n._live)) + '</div>';
    inner += '</div></div>';
  }
  if (ex && n.kind === 'term'){
    inner += '<div class="termbox" data-termbox="'+n.id+'">'+(n.lines||['codon 0.03. no walls: this is the same shell.','type help']).map(l=>'<div>'+esc(l)+'</div>').join('')+
      '<div class="tin"><span>&gt;</span><input data-term="'+n.id+'"></div></div>';
  }

  /* ports */
  const lift = portLift(n);
  pp.inXs.forEach((cx,i)=>{
    const e = S.edges.find(x=>x.t===n.id && x.tp===i);
    const plugged = !e ? false : (negOf(e) ? 'bar' : true);
    inner += portHtml(cx, true, plugged, lift).replace('class="port', 'data-port="'+n.id+':in:'+i+'" class="port');
  });
  pp.outXs.forEach((cx,i)=>{
    inner += portHtml(cx, false, false, 0).replace('class="port', 'data-port="'+n.id+':out:'+i+'" class="port');
  });
  inner += '</div>';

  /* the python side of the morph, crossfaded in */
  inner += '<div class="codelayer" data-code-layer="'+n.id+'" style="opacity:0;">'+pyHighlight(pyOf(n))+'</div>';

  const chev = (canEx && S.settings.detail !== 'values')
    ? '<span class="chev" data-chev="'+n.id+'">'+(ex?'\u25BE':'\u25B8')+'</span>' : '';
  const cmt = n.note ? '<span class="cmt"># '+esc(n.note)+'</span>' : '';
  // things you cannot double-click into (a button fires instead) get an explicit edit badge
  const editable = n.kind === 'button' || n.kind === 'clock' || n.kind === 'say' || n.kind === 'send' || n.kind === 'recv';
  const chrome = '<span class="chrome">'+
    (editable ? '<span data-editbadge="'+n.id+'" title="rename">\u270E</span>' : '')+
    '<span data-del="'+n.id+'" title="remove (or select and press delete)">\u00D7</span></span>';
  // the answer, outside the box: level with the return line if the body is open, under it if not
  const under = (p.lv && S.settings.showVals && (ex && p.row))
    ? '<span class="retval" data-live="'+n.id+'" style="top:'+FACE_H+'px;">'+esc(fmtShort(n._live))+'</span>'
    : (S.settings.valuePos === 'under' && p.lv && S.settings.showVals)
    ? '<span class="undval" data-live="'+n.id+'">'+esc(fmtShort(n._live))+'</span>' : '';
  const sel = S.sel && S.sel.kind === 'node' && S.sel.id === n.id ? ' sel' : '';
  const tintAttr = (n.tint && S.settings.cellColor !== 'off') ? ' data-tint="1"' : '';
  const tintVar  = (n.tint && S.settings.cellColor !== 'off') ? '--tint:'+n.tint+';' : '';
  return '<div class="blk'+(heavy?' heavy':'')+(p.btn?' btn':'')+sel+'" data-blk="'+n.id+'"'+tintAttr+' style="'+tintVar+'left:'+n.x+'px;top:'+n.y+'px;width:'+d.w+'px;height:'+d.h+'px;">'+
    chev + '<span class="grip" data-grip="'+n.id+'" title="drag to move"></span>' +
    (n.tint && S.settings.cellColor === 'badge' ? '<span class="badge"></span>' : '') +
    chrome + inner + cmt + under + '<span class="resz" data-resz="'+n.id+'"></span></div>';
}

var renderLive = function(){

function renderBlocksOnly(){
