let _morphRaf = null;
function setMorph(target, instant){
  S.morphTarget = clamp(target, 0, 1);
  if (instant){ S.morph = S.morphTarget; applyMorph(); return; }
  if (_morphRaf) return;
  const step = () => {
    const d = S.morphTarget - S.morph;
    S.morph += d * 0.16;
    if (Math.abs(d) < 0.002){ S.morph = S.morphTarget; applyMorph(); _morphRaf = null; return; }
    applyMorph(); _morphRaf = requestAnimationFrame(step);
  };
  _morphRaf = requestAnimationFrame(step);
}
const easeInOut = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
function applyMorph(){
  // ONE scale with three stops. 0 to 0.5 goes from the overview (names and numbers only) to
  // the full drawing; 0.5 to 1 is the drawing becoming plain Python. The python morph only
  // starts at the halfway mark, so the first half costs it nothing.
  const want = S.morph < 0.26 ? 'values' : 'full';
  if (S.settings.detail !== want){ S.settings.detail = want; renderBlocksOnly(); }
  const m = clamp((S.morph - 0.5) * 2, 0, 1), cl = codeLayout();
  const ease = easeInOut(m);
  // columns leave a beat apart, so the eye can follow one file at a time across
  const nCols = cl.cols.length || 1, LAG = Math.min(0.30, 0.07 * nCols);
  const colOf = {}; cl.cols.forEach((c,i)=>{ c.i = i; });
  columns().forEach((c,i)=>c.nodes.forEach(n=>{ colOf[n.id] = i; }));
  const stagger = id => {
    const i = colOf[id] || 0, lead = (i / Math.max(1, nCols-1)) * LAG;
    return easeInOut(clamp((m - lead) / Math.max(0.01, 1 - LAG), 0, 1));
  };
  $('mfill').style.width = (S.morph*100)+'%';
  $('mknob').style.left  = (S.morph*100)+'%';
  $('mlL').classList.toggle('on', S.morph < .26);
  const mM = $('mlM'); if (mM) mM.classList.toggle('on', S.morph >= .26 && S.morph < .74);
  $('mlR').classList.toggle('on', S.morph >= .74);
  S.nodes.forEach(n=>{
    const el = document.querySelector('[data-blk="'+n.id+'"]'); if (!el) return;
    const d = dims(n), c = cl.nodes[n.id] || { x:n.x, y:n.y, w:d.w, h:d.h };
    const e = stagger(n.id);
    el.style.left   = Math.round(lerp(n.x, c.x, e))+'px';
    el.style.top    = Math.round(lerp(n.y, c.y, e))+'px';
    el.style.width  = Math.round(lerp(d.w, c.w, e))+'px';
    el.style.height = Math.round(lerp(d.h, c.h, e))+'px';
    // the box outline survives the whole trip, so the eye can follow each cell to its line
    el.style.borderColor = e > .72 ? 'transparent' : 'rgba(23,23,26,'+clamp(1 - e*1.15, 0, 1)+')';
    el.style.boxShadow = e > .28 ? 'none' : '';
    el.style.background = e > .62 ? 'transparent' : 'var(--card)';
    const v = el.querySelector('.vizlayer'), k = el.querySelector('.codelayer');
    if (v) v.style.opacity = String(clamp(1 - e*1.7, 0, 1));
    if (v) v.style.pointerEvents = m > .4 ? 'none' : '';
    if (k) k.style.opacity = String(clamp((e-0.30)*2.2, 0, 1));
    if (k) k.style.pointerEvents = m > .5 ? 'auto' : 'none';   // so names stay brushable in python
    const ch = el.querySelector('.chev'); if (ch) ch.style.opacity = String(clamp(1 - m*2.4, 0, 1));
    const xb = el.querySelector('.xbtn'); if (xb) xb.style.display = m > .3 ? 'none' : '';
  });
  $('wireSvg').style.opacity = String(clamp(1 - m*1.9, 0, 1));
  $('wireHit').style.pointerEvents = m > .4 ? 'none' : '';
  $('notes').style.opacity = String(clamp(1 - m*2.4, 0, 1));
  $('grid').style.opacity  = String(clamp(1 - m*1.5, 0, 1));
  // columns become editor tabs
  const op = clamp((m-0.5)*3, 0, 1);
  $('tabs').innerHTML = op <= 0 ? '' : cl.cols.map(c=>
    '<div class="tabhead" style="left:'+c.x+'px;top:'+(c.y0-26)+'px;opacity:'+op+';">'+esc(c.name)+'.py</div>'+
    '<div class="tabpane" style="left:'+c.x+'px;top:'+(c.y0-2)+'px;width:'+c.w+'px;height:'+(c.y1-c.y0+10)+'px;opacity:'+op+';"></div>').join('');
}

/* The same machine as the lab's diagram, drawn the way that diagram draws it: dose in at the

function sceneLab(){
  /* The lab's picture, standing up. Cells carry the colour of the brick they are in the 3D scene
     -- yellow dose in, blue and red bends, green answer out -- so "which box is which" is a
     question you answer by looking. The parameters sit in two tidy horizontal rows rather than
     being nudged one at a time to keep their wires plumb: with curved wires a readable ROW beats
     seven individually-straight lines. */
  const CX = 330, SPAN = 190, Y = { par1:186, bend:300, par2:414, out:528, light:618 };
  const K = (id,v,min,max,step,cx,y)=>C(id,id,'lit',v,0,y,
      {cx, ui:'slider', min, max, step, col:'model'});
  return {
    cols:['model'],
    nodes:[
      {id:'give', kind:'button', name:'give the dose', cx:CX, x:0, y:12, noIn:true, col:'model'},
      C('dose','dose','lit','0.5', 0, 84, {cx:CX, tint:'#e0a800', ui:'slider', min:0, max:1, step:0.01, col:'model'}),

      K('m1','2.6',  -4,   4,   0.05, CX-282, Y.par1),
      K('c1','-0.1', -2,   2,   0.05, CX-152, Y.par1),
      K('c2','2.5',  -2.5, 2.5, 0.05, CX+152, Y.par1),
      K('m2','-2.6', -4,   4,   0.05, CX+282, Y.par1),

      C('bend1','bend1','expr','relu(m * x + c)',0, Y.bend, {cx:CX-SPAN, tint:'#2e6da4', args:['m','c','x'], col:'model'}),
      C('bend2','bend2','expr','relu(m * x + c)',0, Y.bend, {cx:CX+SPAN, tint:'#b14a2e', args:['x','c','m'], col:'model'}),

      K('w3','0.9', -2, 2, 0.05, CX-282, Y.par2),
      K('c3','0.1', -1, 1, 0.05, CX,     Y.par2),
      K('w4','0.9', -2, 2, 0.05, CX+282, Y.par2),

      C('effect','effect','expr','w3 * a + w4 * b + c3',0, Y.out,
        {cx:CX, tint:'#237841', args:['w3','a','c3','b','w4'], minW:290, col:'model'}),

      {id:'patient', kind:'light', name:'patient', cx:CX, x:0, y:Y.light, hideArgs:true, noOut:true, col:'model'},
    ],
    edges:[
      {f:'give', t:'dose', tp:0},
      {f:'m1', t:'bend1', tp:0}, {f:'c1', t:'bend1', tp:1}, {f:'dose', t:'bend1', tp:2},
      {f:'dose', t:'bend2', tp:0}, {f:'c2', t:'bend2', tp:1}, {f:'m2', t:'bend2', tp:2},
      {f:'w3', t:'effect', tp:0}, {f:'bend1', t:'effect', tp:1}, {f:'c3', t:'effect', tp:2},
      {f:'bend2', t:'effect', tp:3}, {f:'w4', t:'effect', tp:4},
      {f:'effect', t:'patient', tp:0},
    ],
    expanded:{},
    settings:{ wireWeight:true },
  };
}

/* The bonus at the end of lab 1: half a neuron, and the reader finishes it. Everything the
   answer needs is already on the canvas -- a dose, a slope, an offset and a lamp -- so the only
   step left is the one worth doing by hand: make the cell that does the arithmetic and wire the
   three numbers into it.                                                                      */
function sceneBuild(){
  const CX = 300;
  const K = (id,v,min,max,step,cx,y)=>C(id,id,'lit',v,0,y,{cx, ui:'slider', min, max, step, col:'yours'});
  return {
    cols:['yours'],
    notes:[{x:24, y:12, w:540, text:
      'Your turn. Click an empty patch of canvas and type:   neuron(m, x, c) = relu(m * x + c)   '+
      'That makes a cell with three sockets. Drag a wire from m, from dose and from c into those '+
      'sockets, then one from the neuron down to the lamp. Now move the dose slider: the lamp '+
      'should brighten and dim. That is a neuron, and you built it out of the same three atoms '+
      'as everything else in this lab.'}],
    nodes:[
      K('m','2.4', -4, 4, 0.05, CX-156, 132),
      K('dose','0.5', 0, 1, 0.01, CX,   132),
      K('c','-0.4', -2, 2, 0.05, CX+156, 132),
      {id:'lamp', kind:'light', name:'lamp', cx:CX, x:0, y:360, hideArgs:true, noOut:true, col:'yours'},
    ],
    edges:[],
    expanded:{},
    settings:{ wireWeight:true },
  };
}

const SCENES = {
  play:  { label:'playground', make:scenePlay },
  lab:   { label:'lab net',    make:sceneLab },
  build: { label:'build one',  make:sceneBuild },
  gpt:   { label:'microGPT',   make:()=>sceneGpt() },
};
/* A node may say cx instead of x: "put my middle here". Widths depend on the text inside, so
   the only honest time to resolve that is after the cell knows how wide it is. Doing it this way
   is what makes a scene actually symmetric rather than symmetric-looking in the source.        */
function centreNodes(){
  S.nodes.forEach(n=>{ if (n.cx != null) n.x = Math.round(n.cx - dims(n).w / 2); });
  // and a node may instead share another's left edge, so their ports line up and the wire
  // between them drops dead straight rather than stepping sideways for no reason
  S.nodes.forEach(n=>{ if (n.alignL){ const o = nodeById(n.alignL); if (o) n.x = o.x; } });
  /* And a node may park itself so its OWN AXON lands directly over the socket it feeds, which is
     what makes the wire a plumb line. Aligning box centres is the obvious thing and the wrong
     one: a cell's axon leaves from its left, not its middle.                                  */
  S.nodes.forEach(n=>{
    if (!n.overSock) return;
    const tgt = nodeById(n.overSock[0]); if (!tgt) return;
    tgt._d = dims(tgt);
    const px = portXs(tgt, inCount(tgt))[n.overSock[1]];
    if (px == null) return;
    const d = dims(n);
    const outX = hasArgs(n) ? portXs(n, inCount(n))[0]
               : (S.settings.portAlign === 'center' ? Math.round(d.w/2) : LEFT_X);
    n.x = Math.round(tgt.x + px - outX);
  });
  // the mirror of that: put MY socket under someone else's axon, for the last link in a chain
  S.nodes.forEach(n=>{
    if (!n.underAxon) return;
    const src = nodeById(n.underAxon); if (!src) return;
    src._d = dims(src);
    const sOut = hasArgs(src) ? portXs(src, inCount(src))[0]
               : (S.settings.portAlign === 'center' ? Math.round(dims(src).w/2) : LEFT_X);
    const myIn = portXs(n, inCount(n))[0];
    if (myIn == null) return;
    n.x = Math.round(src.x + sOut - myIn);
  });
}
function loadScene(key){
  const sc = SCENES[key].make();
  S.scene = key;
  S.nodes = sc.nodes.map(n=>Object.assign({kind:'cell', mode:'lit'}, n));
  S.edges = sc.edges.map(e=>Object.assign({fp:0}, e));
  S.notes = sc.notes || []; S.cols = sc.cols || [];
  S.expanded = sc.expanded || {};
  S.settings.wireWeight = !!(sc.settings && sc.settings.wireWeight);
  if (sc.settings) Object.assign(S.settings, sc.settings);
  S.pending = S.drag = S.ghost = S.sel = S.editing = null;
  S.fit = !!sc.fit;
  setZoom(sc.zoom || 1);
  render();
  if (S.fit) fitToWidth();
  const w = $('canvasWrap'); if (w) w.scrollTo(0,0);
}

/* ---------- text -> cell. everything here is typeable. ---------- */
function spawnFromText(t, x, y){
  const src = String(t).trim();
  const at = { x:snap(x), y:snap(y) };
  const add = n => { const id = uid(); S.nodes.push(Object.assign({id, kind:'cell', mode:'lit'}, n, at)); return id; };
  // an empty cell: a box with a cursor in it, a socket above and an axon below. type to fill it.
  if (!src){ const id = add({kind:'cell', mode:'lit', name:'', body:''}); render(); openSig(id, true); return id; }
  let m, id = null;
  const head = src.split(/\s+/)[0].toLowerCase();

  if (head === 'gate')       id = add({kind:'gate', body:spaced(src.slice(4).trim()) || 'x > 0', hideArgs:true});
  else if (head === 'button')id = add({kind:'button', name:src.split(/\s+/)[1] || 'press', noIn:true});
  else if (head === 'clock') id = add({kind:'clock', ms:(parseFloat(src.split(/\s+/)[1])||1)*1000, on:false, noIn:true});
  else if (head === 'say')   id = add({kind:'say', name:'say', msg:src.slice(3).trim() || 'hello, world', hideArgs:true});
  else if (head === 'print' || head === 'watch') id = add({kind:'watch', name:'print', hideArgs:true});
  else if (head === 'light') id = add({kind:'light', name:src.split(/\s+/)[1] || 'light', hideArgs:true});
  else if (head === 'loop'){
    id = add({kind:'cell', mode:'code', name:'loop', args:['n'],
      body:'total = 0\nfor i in range(n):\n    total = total + i\nreturn total'});
    S.expanded[id] = true;
  }
  else if (head === 'not' || head === 'invert') id = add({kind:'invert', name:'not'});
  else if (head === 'send') id = add({kind:'send', ch:src.split(/\s+/)[1] || 'ping', hideArgs:true});
  else if (head === 'receive' || head === 'recv') id = add({kind:'recv', ch:src.split(/\s+/)[1] || 'ping', noIn:true});
  else if (head === 'terminal' || head === 'term'){ id = add({kind:'term', name:'terminal', noIn:true, noOut:true}); S.expanded[id] = true; }
  else if (head === 'slider'){ const w = src.split(/\s+/);
    id = add({name:w[1] || 't', mode:'lit', body:w[2] || '0.5', ui:'slider', min:-1, max:1, step:0.01}); S.expanded[id] = true; }
  else if ((m = src.match(/^([A-Za-z_]\w*)\s*\(([^)]*)\)\s*=?\s*(.+)$/))){
    // name(args) body   -> a cell with argument boxes on its border
    const args = m[2].split(',').map(s=>s.trim()).filter(Boolean);
    const body = m[3].trim();
    const multi = body.includes(';');
    id = add({name:m[1], args, mode:multi?'code':'expr', body:multi?body.split(';').map(s=>s.trim()).join('\n'):spaced(body)});
    if (multi) S.expanded[id] = true;
  }
  else if ((m = src.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/)) || (m = src.match(/^([A-Za-z_]\w*)\s+(.+)$/))){
    const name = m[1], body = m[2].trim();
    const isLit = /^-?\d*\.?\d+$/.test(body) || /^(True|False|None)$/.test(body) || /^["'].*["']$/.test(body) || /^\[.*\]$/.test(body);
    id = add({name, mode:isLit?'lit':'expr', body:isLit?body:spaced(body), args:isLit?[]:freeVars(body)});
  }
  else if (/^[A-Za-z_]\w*$/.test(src)) id = add({name:src, mode:'lit', body:'0'});
  else id = add({name:'v', mode:'lit', body:src});
  render();
  return id;
}

/* ---------- type-to-code: say what you want, get a working cell ---------- */
const RECIPES = [
  { re:/random.*(?:from|between)?\s*(-?\d+)\s*(?:to|-|and|\.\.)\s*(-?\d+)/i,
    py:(m)=>'import random\nreturn random.randint('+m[1]+', '+m[2]+')' },
  { re:/random.*(?:number|float|value)/i, py:()=>'import random\nreturn random.random()' },
  { re:/coin|heads or tails/i, py:()=>'import random\nreturn random.choice(["heads", "tails"])' },
  { re:/(?:roll|dice|die)\s*(?:a\s*)?(\d+)?/i, py:(m)=>'import random\nreturn random.randint(1, '+(m[1]||6)+')' },
  { re:/count(?:down)?\s*(?:from)?\s*(\d+)/i, py:(m)=>'out = []\nfor i in range('+m[1]+', 0, -1):\n    out.append(i)\nreturn out' },
  { re:/sum.*1\s*(?:to|\.\.|-)\s*(\d+)/i, py:(m)=>'total = 0\nfor i in range(1, '+m[1]+' + 1):\n    total = total + i\nreturn total' },
  { re:/fizz\s*buzz/i, py:()=>'out = []\nfor i in range(1, 21):\n    if i % 15 == 0:\n        out.append("fizzbuzz")\n    elif i % 3 == 0:\n        out.append("fizz")\n    elif i % 5 == 0:\n        out.append("buzz")\n    else:\n        out.append(i)\nreturn out' },
  { re:/fib/i, py:()=>'a = 0\nb = 1\nout = []\nfor i in range(12):\n    out.append(a)\n    a, b = b, a + b\nreturn out' },
  { re:/average|mean/i, py:()=>'nums = [3, 1, 4, 1, 5, 9, 2, 6]\ntotal = 0\nfor n in nums:\n    total = total + n\nreturn total / len(nums)' },
  { re:/prime/i, py:()=>'out = []\nfor n in range(2, 40):\n    ok = True\n    for d in range(2, n):\n        if n % d == 0:\n            ok = False\n    if ok:\n        out.append(n)\nreturn out' },
  { re:/celsius|fahrenheit/i, py:()=>'c = 100\nreturn c * 9 / 5 + 32' },
  { re:/reverse.*(?:string|word|text)/i, py:()=>'word = "codon"\nout = ""\nfor ch in word:\n    out = ch + out\nreturn out' },
  { re:/neuron|relu|perceptron/i, py:()=>'m = 2.0\nc = -0.5\nz = m * x + c\nif z < 0:\n    z = 0\nreturn z' },
  { re:/squar|\*\*\s*2/i, py:()=>'return x * x' },
  { re:/double|times two/i, py:()=>'return x * 2' },
];
function codeFromIntent(text){
  for (const r of RECIPES){ const m = text.match(r.re); if (m) return r.py(m); }
  return null;
}

/* ============================================================
   microGPT at a glance: karpathy's program, eight cells, five
   columns, one screen. code cells scroll; the column is the file.
   (source: tiny-ai lab 2, "the complete source, block by block")
   ============================================================ */
const GPT_SRC = {
dataset:
`# 1 . dataset  (32,033 names, one per line)
import random
random.seed(1337)

if not os.path.exists('input.txt'):
    import urllib.request
    url = ('https://raw.githubusercontent.com/karpathy/'
           'makemore/refs/heads/master/names.txt')
    urllib.request.urlretrieve(url, 'input.txt')

docs = []
for line in open('input.txt').read().split('\\n'):
    name = line.strip()
    if name != '':
        docs.append(name)
random.shuffle(docs)
print(f"num docs: {len(docs)}")`,
tokenizer:
`# 2 . tokenizer  (letters in, integers out)
all_text = ''.join(docs)
uchars = sorted(set(all_text))   # a..z
BOS = len(uchars)                # 26 = begin / end
vocab_size = len(uchars) + 1     # 27

def encode(doc):
    ids = [BOS]
    for ch in doc:
        ids.append(uchars.index(ch))
    ids.append(BOS)
    return ids

ntest = 1000
test_docs = docs[:ntest]
train_docs = docs[ntest:]`,
value:
`# 3 . Value  (the whole autograd engine)
class Value:
    def __init__(self, data, children=()):
        self.data = data
        self.grad = 0
        self._backward = lambda: None
        self._prev = set(children)

    def __add__(self, other):
        out = Value(self.data + other.data, (self, other))
        def _backward():
            self.grad += out.grad
            other.grad += out.grad
        out._backward = _backward
        return out

    def __mul__(self, other):
        out = Value(self.data * other.data, (self, other))
        def _backward():
            self.grad += other.data * out.grad
            other.grad += self.data * out.grad
        out._backward = _backward
        return out

    def tanh(self):
        t = math.tanh(self.data)
        out = Value(t, (self,))
        def _backward():
            self.grad += (1 - t * t) * out.grad
        out._backward = _backward
        return out

    def backward(self):
        order, seen = [], set()
        def build(v):
            if v not in seen:
                seen.add(v)
                for c in v._prev:
                    build(c)
                order.append(v)
        build(self)
        self.grad = 1
        for v in reversed(order):
            v._backward()`,
helpers:
`# 4 . helpers  (softmax, linear, rmsnorm)
def softmax(logits):
    mx = max(l.data for l in logits)
    exps = [(l - Value(mx)).exp() for l in logits]
    total = sum(exps, Value(0.0))
    return [e / total for e in exps]

def linear(x, w, b):
    out = []
    for i in range(len(w)):
        acc = b[i]
        for j in range(len(x)):
            acc = acc + w[i][j] * x[j]
        out.append(acc)
    return out

def rmsnorm(x):
    ss = Value(0.0)
    for xi in x:
        ss = ss + xi * xi
    inv = (ss / Value(len(x)) + Value(1e-5)) ** -0.5
    return [xi * inv for xi in x]`,
params:
`# 5 . parameters  (every knob in the model)
n_layer, n_head, n_embd = 4, 4, 32
block_size = 16
head_dim = n_embd // n_head

def randn(*shape):
    if len(shape) == 1:
        return [Value(random.gauss(0, 0.02))
                for _ in range(shape[0])]
    return [randn(*shape[1:]) for _ in range(shape[0])]

wte = randn(vocab_size, n_embd)
wpe = randn(block_size, n_embd)
blocks = []
for _ in range(n_layer):
    blocks.append({
        'q': randn(n_embd, n_embd), 'k': randn(n_embd, n_embd),
        'v': randn(n_embd, n_embd), 'o': randn(n_embd, n_embd),
        'fc': randn(4 * n_embd, n_embd),
        'proj': randn(n_embd, 4 * n_embd),
    })
lm_head = randn(vocab_size, n_embd)
params = collect(wte, wpe, blocks, lm_head)
print(f"num params: {len(params)}")`,
gpt:
`# 6 . gpt()  the forward pass, one token at a time
def gpt(token_id, pos_id, keys, values):
    x = add(wte[token_id], wpe[pos_id])

    for li in range(n_layer):
        b = blocks[li]
        xn = rmsnorm(x)
        q = linear(xn, b['q'], b['qb'])
        k = linear(xn, b['k'], b['kb'])
        v = linear(xn, b['v'], b['vb'])
        keys[li].append(k)
        values[li].append(v)

        # attention: how much does each past token matter
        heads = []
        for h in range(n_head):
            lo = h * head_dim
            scores = []
            for kt in keys[li]:
                s = Value(0.0)
                for d in range(head_dim):
                    s = s + q[lo + d] * kt[lo + d]
                scores.append(s / Value(head_dim ** 0.5))
            att = softmax(scores)
            for d in range(head_dim):
                acc = Value(0.0)
                for t, vt in enumerate(values[li]):
                    acc = acc + att[t] * vt[lo + d]
                heads.append(acc)
        x = add(x, linear(heads, b['o'], b['ob']))

        # the little two-layer network on top
        xn = rmsnorm(x)
        h = linear(xn, b['fc'], b['fcb'])
        h = [hi.relu() for hi in h]
        x = add(x, linear(h, b['proj'], b['projb']))

    return linear(rmsnorm(x), lm_head, lm_headb)`,
train:
`# 7 . training loop  (Adam)
learning_rate, num_steps = 0.01, 1000
beta1, beta2, eps_adam = 0.9, 0.95, 1e-8
m = [0.0] * len(params)
v = [0.0] * len(params)

for step in range(num_steps):
    doc = random.choice(train_docs)
    ids = encode(doc)
    keys, values = fresh_cache()
    losses = []
    for pos_id in range(len(ids) - 1):
        token_id, target_id = ids[pos_id], ids[pos_id + 1]
        logits = gpt(token_id, pos_id, keys, values)
        probs = softmax(logits)
        loss_t = -probs[target_id].log()   # surprise at the truth
        losses.append(loss_t)
    loss = (1 / len(losses)) * sum(losses)

    loss.backward()

    lr_t = learning_rate * (1 - step / num_steps)
    for i, p in enumerate(params):
        m[i] = beta1 * m[i] + (1 - beta1) * p.grad
        v[i] = beta2 * v[i] + (1 - beta2) * p.grad ** 2
        m_hat = m[i] / (1 - beta1 ** (step + 1))
        v_hat = v[i] / (1 - beta2 ** (step + 1))
        p.data -= lr_t * m_hat / (v_hat ** 0.5 + eps_adam)
        p.grad = 0

    print(f"step {step+1:4d} / {num_steps} | loss {loss.data:.4f}")`,
sample:
`# 8 . inference  (hallucinate new names)
temperature = 0.5
for sample_idx in range(20):
    keys, values = fresh_cache()
    token_id = BOS
    sample = []
    for pos_id in range(block_size):
        logits = gpt(token_id, pos_id, keys, values)
        scaled = []
        for l in logits:
            scaled.append(l / temperature)
        probs = softmax(scaled)
        weights = []
        for p in probs:
            weights.append(p.data)
        token_id = random.choices(range(vocab_size),
                                  weights=weights)[0]
        if token_id == BOS:
            break
        sample.append(uchars[token_id])
    print(f"sample {sample_idx+1:2d}: {''.join(sample)}")`,
};
function sceneGpt(){
  // each block is as wide as its own longest line, so nothing is clipped or scrolled sideways
  const widthOf = src => Math.min(470, Math.max(210,
    Math.ceil(Math.max(...String(src).split('\n').map(l=>tw(l, 11)))) + 26));
  const BLOCKS = [
    ['d1','dataset',   GPT_SRC.dataset],   ['d2','tokenizer',  GPT_SRC.tokenizer],
    ['d3','Value',     GPT_SRC.value],     ['d4','helpers',    GPT_SRC.helpers],
    ['d5','parameters',GPT_SRC.params],    ['d6','gpt',        GPT_SRC.gpt],
    ['d7','train',     GPT_SRC.train],     ['d8','sample',     GPT_SRC.sample],
  ];
  /* Blocks vary a lot in height, so shelves waste space next to the tall one. Stack them into
     columns instead, always adding to the shortest column, and try every column count to see
     which one lets the fit-to-window zoom be biggest. That is what makes the text readable. */
  const sized = BLOCKS.map(([id,name,src])=>({
    id, name, src, w: widthOf(src), h: String(src).split('\n').length*17.8 + 58 }));
  const availW = (wrap ? wrap.clientWidth : 1500) - 40;
  const availH = (wrap ? wrap.clientHeight : 850) - 150;
  const pack = k => {
    const cols = Array.from({length:k}, ()=>({ items:[], h:0, w:0 }));
    sized.forEach(s=>{
      const c = cols.reduce((a,b)=> b.h < a.h ? b : a);
      c.items.push(s); c.h += s.h + 24; c.w = Math.max(c.w, s.w);
    });
    const W = cols.reduce((a,c)=>a + c.w + 16, 0), H = Math.max(...cols.map(c=>c.h));
    return { cols, W, H, z: Math.min(availW/W, availH/H, 1) };
  };
  let best = null;
  for (let k = 1; k <= sized.length; k++){ const p = pack(k); if (!best || p.z > best.z) best = p; }
  const cells = []; let gx = 24;
  best.cols.forEach(c=>{
    let gy = 132;
    c.items.forEach(s=>{
      cells.push(C(s.id, s.name, 'code', s.src, gx, gy,
        { args:[], maxLines:99, wide:s.w, col:s.name.toLowerCase(), noEval:true }));
      gy += s.h + 24;
    });
    gx += c.w + 16;
  });
  cells.sort((a,b)=> BLOCKS.findIndex(x=>x[0]===a.id) - BLOCKS.findIndex(x=>x[0]===b.id));
  const runX = Math.max(...cells.map(c=>c.x));      // clear of every block, in the free strip on top
  return {
    fit: true,                       // scale so the whole program fills the width on any screen
    cols:BLOCKS.map(b=>b[1].toLowerCase()),
    notes:[
      {x:26, y:24, w:1100, text:'Karpathy\'s microGPT, the whole thing, on one screen: eight blocks, about 250 lines, nothing hidden or scrolled. Press run and the block that is executing lights up, with a bar walking the line it is on. Drag the slider at the top right and the same program becomes plain Python.'},
    ],
    nodes:[
      // one column per block, side by side rather than stacked, because the limit on how big
      // the text can be is the tallest column
      ...cells,
      {id:'go', kind:'button', name:'run', x:runX, y:82, noIn:true, col:'train'},
    ],
    // only downhill wires are drawn. the links that would have to climb back up a column
    // (tokenizer -> parameters, helpers -> gpt) are name references, the way one .py file
    // reaches another: a wire with no ink beats a wire that snakes under a cell.
    edges:[],   // side by side, so the order left to right is the reading order
    expanded:{ d1:true, d2:true, d3:true, d4:true, d5:true, d6:true, d7:true, d8:true },
  };
}
/* the birds-eye run: the whole cell lights, and inside it a line pointer walks */
function runGptDemo(){
  const order = ['d1','d2','d3','d4','d5','d6','d7','d8'];
  let k = 0;
  const stepCell = () => {
    if (k >= order.length) return;
    const id = order[k++], n = nodeById(id); if (!n) return;
    const el = document.querySelector('[data-blk="'+id+'"]');
    if (el) el.classList.add('firing');
    const total = codeLines(n), shown = Math.min(total, n.maxLines || total);
    let line = 0;
    const ptr = document.querySelector('[data-ptr="'+id+'"]');
    const box = ptr && ptr.parentElement;
    const walk = setInterval(()=>{
      if (line >= total){ clearInterval(walk); if (ptr) ptr.style.display='none';
        if (el) el.classList.remove('firing'); setTimeout(stepCell, 90); return; }
      if (ptr){ ptr.style.display = 'block'; ptr.style.top = (line*17.8 + 6) + 'px'; }
      if (box && line >= shown - 2) box.scrollTop = Math.max(0, (line - shown + 3) * 17.8);
      line++;
    }, Math.max(14, 420/total));
    outEdges(id).forEach(e=>firePulse(e, 0));
  };
  stepCell();
}

const paper = $('paper'), wrap = $('canvasWrap');
/* paper coordinates, corrected for canvas zoom, so every interaction survives a zoom-out */
const paperXY = e => { const r = paper.getBoundingClientRect(), z = S.zoom || 1;
  return { x:(e.clientX-r.left)/z, y:(e.clientY-r.top)/z }; };
function setZoom(z){
  S.zoom = clamp(z, 0.25, 1.6);
  paper.style.transform = S.zoom === 1 ? '' : 'scale('+S.zoom+')';
  paper.style.transformOrigin = '0 0';
}
/* use the whole width before shrinking the text any further than it has to be */
function contentBox(){
  let l = 1e9, t = 1e9, r = 0, b = 0;
  S.nodes.forEach(n=>{ const d = dims(n);
    l = Math.min(l, n.x); t = Math.min(t, n.y);
    r = Math.max(r, n.x + d.w); b = Math.max(b, n.y + d.h); });
  return S.nodes.length ? {l, t, r, b, w:r-l, h:b-t} : {l:0,t:0,r:0,b:0,w:0,h:0};
}
function fitToWidth(){
  if (!S.nodes.length) return;
  const c = contentBox();
  const availW = wrap.clientWidth - 30, availH = wrap.clientHeight - 24;
  setZoom(Math.min(availW / (c.r + 24), availH / (c.b + 40), 1));
}
/* Embedded, the canvas is a picture in someone else's panel: it should fill that panel and never
   grow a scrollbar. Fit both axes to the content's real box (not its distance from the origin),
   then nudge it so the drawing sits in the middle of the space it was given.                  */
function fitToBox(){
  if (!S.nodes.length || !wrap.clientWidth) return;
  // measure the DOM, not the model: mid-morph the blocks are somewhere between the two layouts
  // and only the elements themselves know where. This keeps the fit honest at every slider stop.
  let c = null;
  const els = paper.querySelectorAll('.blk, .note, .tabhead, .tabpane');
  if (els.length){
    let l=1e9,t=1e9,r=-1e9,b=-1e9;
    els.forEach(el=>{ l=Math.min(l,el.offsetLeft); t=Math.min(t,el.offsetTop);
      r=Math.max(r,el.offsetLeft+el.offsetWidth); b=Math.max(b,el.offsetTop+el.offsetHeight); });
    c = {l,t,r,b,w:r-l,h:b-t};
  }
  if (!c || !(c.w > 0) || !(c.h > 0)) c = contentBox();
  const M = 14;
  // fill the panel, but never magnify past legible: blown-up code looks broken, not close-up
  const cap = S.morph > 0.5 ? 1 : 1.2;
  const z = clamp(Math.min((wrap.clientWidth - M*2) / c.w, (wrap.clientHeight - M*2) / c.h), 0.25, cap);
  S.zoom = z;
  paper.style.transformOrigin = '0 0';
  paper.style.transform = 'translate(' + ((wrap.clientWidth  - c.w*z)/2 - c.l*z) + 'px,' +
                                         ((wrap.clientHeight - c.h*z)/2 - c.t*z) + 'px) scale(' + z + ')';
}
window.addEventListener('resize', ()=>{ if (S.fit) fitToWidth(); });

document.addEventListener('mousedown', e=>{
  const t = e.target;
  // any press inside the panel means the reader has found it: tell the host so its auto-preview
  // of the overview/Python morph can stop rather than keep moving under their hands
  embedPost({ codon:'touched' });
  if (t.closest('#morphtrack')) return;
  if (t.id === 'vbadge'){ $('vmenu').classList.toggle('open'); return; }
  if (!t.closest('#vmenu')) $('vmenu').classList.remove('open');
  if (t.id === 'gearBtn'){ $('drawer').classList.toggle('open'); return; }
  if (t.id === 'drawerX'){ $('drawer').classList.remove('open'); return; }

  const sc = t.closest('[data-scene]');
  if (sc){ loadScene(sc.dataset.scene); return; }
  const vo = t.closest('[data-vopen]'); if (vo){ window.open(vo.dataset.vopen, '_blank'); return; }
  const vs = t.closest('[data-vsnap]'); if (vs){ restore(S.versions.filter(v=>v.kind==='snap')[+vs.dataset.vsnap]); return; }

    else if (a === 'export') download('codon_'+S.scene+'.json', JSON.stringify({v:'0.03', scene:S.scene, nodes:S.nodes, edges:S.edges, notes:S.notes, cols:S.cols, expanded:S.expanded, settings:S.settings}, null, 2), 'application/json');

    else { const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
      inp.onchange = ()=>{ const f = inp.files[0]; if (f) f.text().then(x=>restore({data:x})); }; inp.click(); }
    return; }
  const so = t.closest('[data-set]');
  if (so){ const [k,v] = so.dataset.set.split(':'); S.settings[k] = v; render(); $('drawer').classList.add('open'); return; }
  const pa = t.closest('[data-act]');
  if (pa){ if (pa.dataset.act === 'typenet') typeNet(); else askIntent(); return; }
  const pt = t.closest('[data-ptile]');
  if (pt){ e.preventDefault(); S.pdrag = { text:pt.dataset.ptile, label:pt.querySelector('.pl') ? pt.querySelector('.pl').textContent : pt.textContent, cx:e.clientX, cy:e.clientY, moved:false }; return; }

  /* comments: drag to move, grip to resize, double-click to type in */
  const ng = t.closest('[data-ngrip]');
  if (ng){ e.preventDefault(); const i = +ng.dataset.ngrip;
    S.ndrag = { i, mode:'size', sx:paperXY(e).x, sw:S.notes[i].w || 230 }; return; }
  const nt = t.closest('[data-note]');
  if (nt && !nt.classList.contains('editing')){
    e.preventDefault(); const i = +nt.dataset.note, m = paperXY(e);
    S.ndrag = { i, mode:'move', dx:m.x - S.notes[i].x, dy:m.y - S.notes[i].y, moved:false };
    return;
  }

  if (S.morph > 0.4) return;   // in python view the canvas is read-only

  /* wire hit: select, delete, or flip to inhibition */
  const ex = t.closest('[data-edgex]');
  if (ex){ deleteEdgeByKey(ex.dataset.edgex); return; }
  const hitp = t.closest('[data-hit]');
  if (hitp){ e.preventDefault(); selectEdge(hitp.dataset.hit); return; }

  /* A number on a cell face is a knob. Press on it and drag up or down and it changes, exactly
     like the weight boxes on the lab's own diagram; let go without moving and you get a caret to
     type in instead. This is the only way to reach a value in overview mode, where nothing is
     expanded and the slider is not on screen -- and it is faster than the slider anyway.      */
  const gripEl = t.closest('[data-grip]');
  if (gripEl){ const n = nodeById(gripEl.dataset.grip);
    if (n){ e.preventDefault(); const m = paperXY(e);
      selectNode(n.id); S._moved = false;
      S.drag = { id:n.id, dx:m.x - n.x, dy:m.y - n.y, kind:n.kind };
      const el = document.querySelector('[data-blk="'+n.id+'"]'); if (el) el.classList.add('dragging');
      return; } }
  const bdEl = t.closest('[data-edit]');
  if (bdEl && !e.shiftKey){
    const n = nodeById(bdEl.dataset.edit);
    if (n && n.mode === 'lit' && isFinite(parseFloat(n.body))){
      e.preventDefault();
      const span = (n.max != null && n.min != null) ? (n.max - n.min) : 8;
      S.wdrag = { n, sy:e.clientY, sv:parseFloat(n.body)||0, scale:span/8, moved:false, el:bdEl };
      return;
    }
  }

  const portEl = t.closest('[data-port]');
  if (portEl){
    e.preventDefault(); e.stopPropagation();
    const [id, dir, idx] = portEl.dataset.port.split(':');
    const pp = _pp[id]; if (!pp) return;
    if (dir === 'out'){ const o = pp.outs[0], m = paperXY(e); S.pending = { f:id, fp:0, x1:o.x, y1:o.y, mx:m.x, my:m.y }; }
    else { const old = S.edges.find(x=>x.t===id && x.tp === +idx);
      if (old){ const src = _pp[old.f];
        if (src){ const m = paperXY(e); S.edges = S.edges.filter(x=>x !== old);
          S.pending = { f:old.f, fp:0, x1:src.outs[0].x, y1:src.outs[0].y, mx:m.x, my:m.y }; render(); } } }
    renderWires(); return;
  }
  if (S.editing && !t.closest('[data-sigedit]')) closeSig(true);
  const chev = t.closest('[data-chev]');
  if (chev){ const id = chev.dataset.chev; S.expanded[id] = !S.expanded[id]; render(); return; }
  const del = t.closest('[data-del]'); if (del){ deleteNode(del.dataset.del); return; }
  const fb = t.closest('[data-fire]');
  if (fb){ e.preventDefault(); const id = fb.dataset.fire;
    flashBlock(id); bang(id); return; }              // a button is for pressing
  const eb = t.closest('[data-editbadge]'); if (eb){ e.preventDefault(); openSig(eb.dataset.editbadge, true); return; }
  const aa = t.closest('[data-addarg]');
  if (aa){
    e.preventDefault();
    const n = nodeById(aa.dataset.addarg); if (!n) return;
    n.args = argsOf(n).slice();
    const used = new Set(n.args);
    let name = 'abcdefghij'.split('').find(c=>!used.has(c)) || ('a'+n.args.length);
    n.args.push(name);
    if (n.mode === 'expr' && !new RegExp('\\b'+name+'\\b').test(n.body)) n.body = n.body + ' + ' + name;
    render();
    const f = document.querySelector('[data-arg="'+n.id+':'+(n.args.length-1)+'"]');
    if (f){ f.focus(); const r = document.createRange(); r.selectNodeContents(f);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    return;
  }
  const rz = t.closest('[data-resz]');
  if (rz){ e.preventDefault(); e.stopPropagation(); const n = nodeById(rz.dataset.resz); S.resize = {id:n.id, sw:dims(n).w, sx:paperXY(e).x}; return; }
  const ck = t.closest('[data-clock]'); if (ck){ const n = nodeById(ck.dataset.clock); n.on = !n.on; render(); return; }

  const blk = t.closest('[data-blk]');
  if (blk){
    const n = nodeById(blk.dataset.blk); if (!n) return;
    if (t.closest('textarea,input,[contenteditable],.termbox')) { selectNode(n.id); return; }
    if (n.kind === 'gate' && t.closest('.gateglyph')){
      n.manual = n.manual == null ? !(n._open !== false) : (n.manual ? null : true);
      render(); return;
    }
    e.preventDefault(); selectNode(n.id); S._moved = false;
    const m0 = paperXY(e);
    if (e.altKey){
      const id = uid(), copy = JSON.parse(JSON.stringify(n)); copy.id = id;
      if (copy.name && /\d+$/.test(copy.name)) copy.name = copy.name.replace(/\d+$/, m=>+m+1);
      S.nodes.push(copy); if (S.expanded[n.id]) S.expanded[id] = true; render();
      S.drag = { id, dx:m0.x-n.x, dy:m0.y-n.y, kind:n.kind };
    } else S.drag = { id:n.id, dx:m0.x-n.x, dy:m0.y-n.y, kind:n.kind };
    blk.classList.add('dragging');
    return;
  }
  if (t === paper || t.id === 'grid' || t.id === 'guides' || t.id === 'notes' || t.id === 'overlay' || t.id === 'blocks'){
    e.preventDefault();
    // a click on empty paper always clears the selection first
    if (S.sel){ S.sel = null; refreshSel(); renderWires(); return; }
    const m = paperXY(e); S.ghost = { x:snap(m.x), y:snap(m.y) }; renderGhost();
  }
});

/* --- snap two cells together: an axon lands in a synapse --- */
/* if the axon dot touches the socket at all, that is a connection. the radius is the sum of
   the two glyph radii plus a little slack, which is far more forgiving than a fixed pixel box. */
const SNAP_R = SOCK_R + AXON_R + 14;
function findSnap(n){
  if (!S.settings.snapWire) return null;
  const me = portPos(n);
  let best = null;
  S.nodes.forEach(o=>{
    if (o.id === n.id) return;
    const op = portPos(o);
    me.outs.forEach(mo=>op.ins.forEach((oi,i)=>{
      const d = Math.hypot(mo.x-oi.x, mo.y-oi.y);
      if (d < SNAP_R && (!best || d < best.d)) best = { d, f:n.id, t:o.id, tp:i, at:oi, mine:mo };
    }));
    me.ins.forEach((mi,i)=>op.outs.forEach(oo=>{
      const d = Math.hypot(mi.x-oo.x, mi.y-oo.y);
      if (d < SNAP_R && (!best || d < best.d)) best = { d, f:o.id, t:n.id, tp:i, at:mi, mine:mi };
    }));
  });
  return best;
}
document.addEventListener('mousemove', e=>{
  if (S.drag){
    const n = nodeById(S.drag.id); if (!n) return;
    const m = paperXY(e);
    let x = m.x - S.drag.dx, y = m.y - S.drag.dy;
    if (Math.abs(x-n.x) + Math.abs(y-n.y) > 3) S._moved = true;
    if (!e.shiftKey){ x = snap(x); y = snap(y); }
    n.x = Math.max(0, x); n.y = Math.max(0, y);
    const el = document.querySelector('[data-blk="'+n.id+'"]');
    if (el){ el.style.left = n.x+'px'; el.style.top = n.y+'px'; }
    const sn = findSnap(n);
    S.snapHint = sn ? sn.at : null;
    if (el) el.classList.toggle('snapok', !!sn);
    renderWires();
  } else if (S.resize){
    const n = nodeById(S.resize.id);
    n.wOver = Math.max(32, S.resize.sw + paperXY(e).x - S.resize.sx);
    const el = document.querySelector('[data-blk="'+n.id+'"]'); if (el) el.style.width = dims(n).w+'px';
    renderWires();
  } else if (S.ndrag){
    const m = paperXY(e), t2 = S.notes[S.ndrag.i], el = document.querySelector('[data-note="'+S.ndrag.i+'"]');
    if (S.ndrag.mode === 'move'){
      S.ndrag.moved = true;
      t2.x = Math.max(0, snap(m.x - S.ndrag.dx)); t2.y = Math.max(0, snap(m.y - S.ndrag.dy));
      if (el){ el.style.left = t2.x+'px'; el.style.top = t2.y+'px'; }
    } else {
      t2.w = Math.max(90, Math.round(S.ndrag.sw + m.x - S.ndrag.sx));
      if (el) el.style.width = t2.w+'px';
    }
  } else if (S.pending){ const m = paperXY(e); S.pending.mx = m.x; S.pending.my = m.y; renderWires(); }
  else if (S.pdrag){ S.pdrag.cx = e.clientX; S.pdrag.cy = e.clientY; S.pdrag.moved = true; renderPdrag(); }
  else if (S.wdrag){
    if (Math.abs(e.clientY - S.wdrag.sy) > 2) S.wdrag.moved = true;
    const n = S.wdrag.n;
    let v = S.wdrag.sv + (S.wdrag.sy - e.clientY) * 0.012 * (S.wdrag.scale||1);
    if (n.min != null) v = Math.max(n.min, v);
    if (n.max != null) v = Math.min(n.max, v);
    v = Math.round(v*100)/100;
    n.body = String(v); renderLive();
    const f = document.querySelector('[data-edit="'+n.id+'"]'); if (f) f.textContent = String(v);
    const sl = document.querySelector('[data-slider="'+n.id+'"]'); if (sl) sl.value = v;
  }
});
document.addEventListener('mouseup', e=>{
  if (S.drag){
    const d = S.drag; S.drag = null;
    const n = nodeById(d.id);
    const el = document.querySelector('[data-blk="'+d.id+'"]');
    if (el){ el.classList.remove('dragging'); el.classList.remove('snapok'); }
    const sn = n && S._moved ? findSnap(n) : null;
    if (sn){
      S.edges = S.edges.filter(x=>!(x.t === sn.t && x.tp === sn.tp));
      S.edges.push({ f:sn.f, fp:0, t:sn.t, tp:sn.tp });
      const tgt = nodeById(sn.t), srcn = nodeById(sn.f);
      if (tgt && srcn && !tgt.hideArgs && tgt.args && tgt.args[sn.tp] === undefined) tgt.args[sn.tp] = sanitize(srcn.name||'x');
    }
    S.snapHint = null;
    if (!S._moved && d.kind === 'button'){
      flashBlock(d.id);
      if (S.scene === 'gpt') runGptDemo(); else bang(d.id);
    }
    render();
  }
  if (S.resize){ S.resize = null; render(); }
  if (S.ndrag){ S.ndrag = null; }
  if (S.wdrag){
    const w = S.wdrag; S.wdrag = null;
    // a press with no drag is still a click: put the caret in so you can just type the number
    if (!w.moved && w.el && w.el.isConnected){ w.el.focus();
      const r = document.createRange(); r.selectNodeContents(w.el);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    else render();
  }
  if (S.pending){
    const m = paperXY(e); let hit = null;
    Object.entries(_pp).forEach(([id,pp])=>{ pp.ins.forEach((pt,i)=>{
      if (Math.hypot(pt.x-m.x, pt.y-m.y) < 22) hit = { t:id, tp:i }; }); });
    if (!hit){
      const el = document.elementFromPoint(e.clientX, e.clientY), bl = el && el.closest && el.closest('[data-blk]');
      if (bl){ const n = nodeById(bl.dataset.blk);
        if (n && !n.hideArgs && n.args){ hit = { t:n.id, tp:n.args.length }; } }
    }
    const pn = S.pending; S.pending = null;
    if (hit && hit.t !== pn.f){
      const tgt = nodeById(hit.t), srcn = nodeById(pn.f);
      if (tgt && !tgt.hideArgs && tgt.args && hit.tp >= tgt.args.length)
        tgt.args[hit.tp] = sanitize((srcn && srcn.name) || ('a'+(hit.tp+1)));
      S.edges = S.edges.filter(x=>!(x.t === hit.t && x.tp === hit.tp));
      S.edges.push({ f:pn.f, fp:0, t:hit.t, tp:hit.tp });
    }
    render();
  }
  if (S.pdrag){
    const pd = S.pdrag; S.pdrag = null; renderPdrag();
    const r = wrap.getBoundingClientRect(), m = paperXY(e);
    if (e.clientX > r.left && e.clientY > r.top) spawnFromText(pd.text, m.x, m.y);
    else if (!pd.moved) spawnFromText(pd.text, 300, 700);
  }
});

/* --- brushing, and the argument name/value swap on cell hover --- */
function refreshArgs(){
  S.nodes.forEach(n=>{
    const ab = argBoxes(n); if (!ab.length) return;
    ab.forEach((b,i)=>{
      const el = document.querySelector('[data-arg="'+n.id+':'+i+'"]');
      if (el && document.activeElement !== el && el.textContent !== b.label) el.textContent = b.label;
    });
  });
}

document.addEventListener('blur', e=>{
  const t = e.target;
  if (t.dataset && t.dataset.arg){
    const [id,i] = t.dataset.arg.split(':'); const n = nodeById(id);
    if (n){
      const was = n.args[+i];
      const now = sanitize(t.textContent.trim() || was || ('a'+(+i+1)));
      if (now !== was){
        n.args[+i] = now;
        // renaming an argument renames it in the body too, so the cell stays consistent
        if (n.body) n.body = String(n.body).replace(new RegExp('\\b'+was.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g'), now);
      }
    }
    render(); return;
  }
  if (t.dataset && t.dataset.edit) render();
}, true);
document.addEventListener('keydown', e=>{
  const t = e.target;
  if (t.dataset && t.dataset.sigedit){
    if (e.key === 'Enter'){ e.preventDefault(); closeSig(true); }
    if (e.key === 'Escape'){ e.preventDefault(); closeSig(false); }
    if (e.key === 'Tab'){ e.preventDefault(); closeSig(true); }
    return;
  }
  if (t.dataset && (t.dataset.edit || t.dataset.arg) && e.key === 'Enter'){ e.preventDefault(); t.blur(); return; }
  if (t.dataset && t.dataset.term && e.key === 'Enter'){
    const n = nodeById(t.dataset.term), v = t.value.trim();
    let resp;
    if (v === 'help') resp = 'atoms: cell wire gate. try: atoms, py, ls';
    else if (v === 'atoms') resp = 'cell . wire . gate  (+ name, + nest)';
    else if (v === 'ls') resp = columns().map(c=>c.name+'.py').join('  ');
    else if (v === 'py') resp = 'exported the canvas as python', setTimeout(exportPy, 10);
    else if (v) { const r = runPy('return ' + v, {}); resp = r.value !== undefined ? fmt(r.value) : (r.out[0] || 'sh: ' + v); }
    n.lines = [...(n.lines || ['codon 0.03. no walls: this is the same shell.','type help']), '> '+v, ...(resp?[resp]:[])].slice(-6);
    render();
    setTimeout(()=>{ const ni = document.querySelector('[data-term="'+n.id+'"]'); if (ni) ni.focus(); }, 0);
    return;
  }
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || (t.isContentEditable)) return;
  if ((e.key === 'Backspace' || e.key === 'Delete') && S.sel){
    e.preventDefault();
    if (S.sel.kind === 'node') deleteNode(S.sel.id); else deleteEdgeByKey(S.sel.key);
    return;
  }
  if (e.key === 'i' && S.sel && S.sel.kind === 'edge'){
    const ed = S.edges.find(x=>edgeKey(x) === S.sel.key); if (ed){ ed.inv = !ed.inv; render(); } return;
  }
  if (e.key === 'Escape'){ if (S.ghost){ S.ghost = null; renderGhost(); } selectNode(null); }
  if (e.key === '1') setMorph(0);
  if (e.key === '2') setMorph(0.5);
  if (e.key === '3') setMorph(1);
  if (e.key === '-' || e.key === '_') setZoom((S.zoom||1) - 0.1);
  if (e.key === '=' || e.key === '+') setZoom((S.zoom||1) + 0.1);
  if (e.key === '0') setZoom(1);
});

/* --- the ghost input: typed text becomes a cell without moving --- */
let _ghostTok = 0;
function renderGhost(){
  const ov = $('overlay'), old = ov.querySelector('.ghostin'); if (old) old.remove();
  if (!S.ghost) return;
  if (!S.ghost.tok) S.ghost.tok = ++_ghostTok;
  const myTok = S.ghost.tok;
  const el = document.createElement('div');
  el.className = 'ghostin';
  el.style.left = S.ghost.x+'px'; el.style.top = S.ghost.y+'px';
  // an empty cell, with its socket and its axon showing, so it is obvious it can do more
  el.innerHTML =
    '<svg class="gport" width="18" height="19" viewBox="0 0 18 19" style="position:absolute;left:3px;top:-19px;">'+
      '<path d="M2.5,6 A6.5,6.5 0 0 0 15.5,6" fill="var(--card)" stroke="var(--faint)" stroke-width="1.5"/>'+
      '<line x1="9" y1="12.1" x2="9" y2="19" stroke="var(--faint)" stroke-width="1.5"/></svg>'+
    '<input class="gi" spellcheck="false">'+
    '<svg class="gport" width="18" height="18" viewBox="0 0 18 18" style="position:absolute;left:3px;top:100%;">'+
      '<line x1="9" y1="0" x2="9" y2="13" stroke="var(--faint)" stroke-width="1.5"/>'+
      '<circle cx="9" cy="13" r="3.9" fill="var(--faint)"/></svg>'+
    '<div class="gh">type a name, then its arguments &middot; fan 42 &middot; add a b &middot; gate x &gt; 0</div>';
  ov.appendChild(el);
  const inp = el.querySelector('input');
  const fit = () => { inp.style.width = Math.max(52, tw(inp.value || '', 12.5) + 16) + 'px'; };
  fit(); inp.focus();
  inp.addEventListener('input', fit);
  inp.addEventListener('keydown', ev=>{
    if (ev.key === 'Enter' && inp.value.trim()){
      const g = S.ghost, v = inp.value.trim(); S.ghost = null; renderGhost();
      const gen = codeFromIntent(v);
      if (gen && !/^\w+\s*[\d(]/.test(v)){
        const id = uid();
        S.nodes.push({ id, kind:'cell', mode:'code', name:sanitize(v.split(/\s+/).slice(0,2).join('_')).slice(0,12) || 'f',
          body:gen, args:/\bx\b/.test(gen) ? ['x'] : [], x:snap(g.x), y:snap(g.y), note:v });
        S.expanded[id] = true; render();
        toastAt(g.x, g.y-30, 'wrote it');
        return;
      }
      const id = spawnFromText(v, g.x, g.y);
      // a bare signature means you meant a function: enter drops you straight into its body
      const n = id && nodeById(id);
      if (n && n.kind === 'cell' && /^[A-Za-z_]\w*(\s+[A-Za-z_]\w*)+$/.test(v)){
        n.mode = 'code'; n.body = ''; S.expanded[id] = true; render();
        const ta = document.querySelector('[data-code="'+id+'"]'); if (ta) ta.focus();
      }
    }
    if (ev.key === 'Escape'){ S.ghost = null; renderGhost(); }
  });
  // only the ghost that owns this input may dismiss it, and never while a script is typing
  inp.addEventListener('blur', ()=>setTimeout(()=>{
    if (!_typing && S.ghost && S.ghost.tok === myTok){ S.ghost = null; renderGhost(); }
  }, 140));
}
function renderPdrag(){
  let el = document.getElementById('pdragEl');
  if (!S.pdrag){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id = 'pdragEl';
    el.style.cssText = 'position:fixed;padding:4px 9px;border:1px solid var(--ink);border-radius:5px;background:#FFF;font-size:11.5px;font-family:var(--mono);pointer-events:none;box-shadow:2px 2px 0 rgba(23,23,26,.1);z-index:99;';
    document.body.appendChild(el); }
  el.textContent = S.pdrag.label; el.style.left = (S.pdrag.cx+8)+'px'; el.style.top = (S.pdrag.cy+8)+'px';
}

/* --- proof: build the whole net with nothing but the keyboard --- */
const NET_SCRIPT = [
  ['dose 0.5',                    480, 48,  'input'],
  ['m1 2.6',                      120, 216, 'left_bend'],
  ['c1 -0.1',                     264, 216, 'left_bend'],
  ['h1(x, m1, c1) relu(m1 * x + c1)', 120, 384, 'left_bend'],
  ['m2 -2.6',                     720, 216, 'right_bend'],
  ['c2 2.5',                      864, 216, 'right_bend'],
  ['h2(x, m2, c2) relu(m2 * x + c2)', 720, 384, 'right_bend'],
  ['w3 0.9',                      384, 528, 'output'],
  ['w4 0.9',                      528, 528, 'output'],
  ['c3 0.1',                      672, 528, 'output'],
  ['y(h1, h2, w3, w4, c3) w3 * h1 + w4 * h2 + c3', 384, 672, 'output'],
  ['target 1.0',                  936, 672, 'score'],
  ['loss(y, target) (y - target) ** 2', 936, 792, 'score'],
];
const NET_WIRES = [['dose','h1',0],['m1','h1',1],['c1','h1',2],['dose','h2',0],['m2','h2',1],['c2','h2',2],
  ['h1','y',0],['h2','y',1],['w3','y',2],['w4','y',3],['c3','y',4],['y','loss',0],['target','loss',1]];
var _typing = false, _typeRun = 0;
function typeNet(){
  const run = ++_typeRun; _typing = true;
  S.nodes = []; S.edges = []; S.notes = [{x:26, y:14, text:'every character of a neural network,\ntyped on a keyboard. nothing else.'}];
  S.cols = ['input','left_bend','right_bend','output','score']; S.expanded = {};
  S.settings.wireWeight = true; S.scene = 'net'; setZoom(1); setMorph(0, true); render();
  const named = {};
  let i = 0;
  const nextCell = () => {
    if (run !== _typeRun) return;              // a newer run has taken over
    if (i >= NET_SCRIPT.length){
      NET_WIRES.forEach(([f,t,tp])=>{ if (named[f] && named[t]) S.edges.push({f:named[f], fp:0, t:named[t], tp}); });
      render(); _typing = false;
      toastAt(120, 60, 'a neural network, typed');
      return;
    }
    const [text, x, y, col] = NET_SCRIPT[i++];
    S.ghost = { x, y }; renderGhost();
    const inp = document.querySelector('.ghostin input'); if (!inp){ _typing = false; return; }
    let k = 0;
    const typ = setInterval(()=>{
      if (run !== _typeRun){ clearInterval(typ); return; }
      if (k < text.length){ inp.value = text.slice(0, ++k); inp.dispatchEvent(new Event('input')); return; }
      clearInterval(typ);
      S.ghost = null; renderGhost();
      const id = spawnFromText(text, x, y);
      const nd = nodeById(id); if (nd) nd.col = col;
      const nm = text.match(/^([A-Za-z_]\w*)/); if (nm && id) named[nm[1]] = id;
      setTimeout(nextCell, 110);
    }, 26);
  };
  nextCell();
}
function askIntent(){
  const wr = wrap.getBoundingClientRect();
  S.ghost = { x: snap(wrap.scrollLeft + 60), y: snap(wrap.scrollTop + 60) };
  renderGhost();
  const inp = document.querySelector('.ghostin input');
  if (inp) inp.placeholder = 'random number from 1 to 10';
  const gh = document.querySelector('.ghostin .gh');
  if (gh) gh.textContent = 'say what you want in english, press enter';
}

/* ---------- deep links ----------
   ?scene=net&morph=1&zoom=.6&brush=m1&set=temp:80&fire=btn1&bare=1
   used for sharing a view, and for rendering the README frames deterministically. */
function applyQuery(){
  const q = new URLSearchParams(location.search);
  if (!q.toString()) return;
  if (q.get('bare')){ $('pal').style.display = 'none'; }
  const sc = q.get('scene'); if (sc && SCENES[sc]) loadScene(sc);
  (q.getAll('set') || []).forEach(pair=>{
    const [name, v] = pair.split(':');
    const n = S.nodes.find(x=>sanitize(x.name||'') === sanitize(name||''));
    if (n && v != null){ n.body = v; }
  });
  if (q.get('neg')) S.settings.negStyle = q.get('neg');
  if (q.get('detail')) S.settings.detail = q.get('detail');
  if (q.get('port')) S.settings.portStyle = q.get('port');
  if (q.get('zoom')) setZoom(parseFloat(q.get('zoom')));
  render();
  if (q.get('morph') != null) setMorph(parseFloat(q.get('morph')), true);
  if (q.get('brush')) setBrush(sanitize(q.get('brush')));
  const f = q.get('fire');
  if (f){ const n = S.nodes.find(x=>x.id === f || sanitize(x.name||'') === sanitize(f));
    if (n){ flashBlock(n.id); bang(n.id); } }
}

/* ============================================================
   embed mode: a host page can drop codon in an iframe and drive it.
     <iframe src="codon/index.html?scene=net&embed=1">
   host -> codon   {codon:'set',   values:{m1:2.6, c1:-0.1}}
                   {codon:'brush', name:'m1'}          (null clears)
                   {codon:'morph', v:0.5}
                   {codon:'fire',  name:'give the dose'}
   codon -> host   {codon:'ready', names:[...]}
                   {codon:'change', values:{...}}      whenever anything changes
                   {codon:'brush',  name:'m1'|null}    whatever the pointer is over
   ============================================================ */
let _embedHost = null, _lastSent = '';
function embedValues(){
  const out = {};
  S.nodes.forEach(n=>{ if (n.kind === 'cell' && n.mode === 'lit' && n.name) out[sanitize(n.name)] = Number(n.body); });
  return out;
}
function embedPost(msg){ if (_embedHost) _embedHost.postMessage(Object.assign({codon:1}, msg), '*'); }
function embedSync(){
  if (!_embedHost) return;
  const v = embedValues(), s = JSON.stringify(v);
  if (s !== _lastSent){ _lastSent = s; embedPost({ codon:'change', values:v }); }
}
window.addEventListener('message', ev=>{
  const d = ev.data; if (!d || !d.codon) return;
  _embedHost = ev.source;
  // the host may ping us at any time; always answer, so the handshake cannot be lost to a race
  if (d.codon === 'hello'){ embedPost({ codon:'ready', names:Object.keys(embedValues()) }); return; }
  if (d.codon === 'set'){
    let touched = false;
    Object.entries(d.values || {}).forEach(([k,val])=>{
      const n = S.nodes.find(x=>x.kind === 'cell' && sanitize(x.name||'') === sanitize(k));
      if (n && String(n.body) !== String(val)){ n.body = String(val); touched = true; }
    });
    if (touched){
      _lastSent = JSON.stringify(embedValues());     // do not echo the host's own change back
      renderLive();
      S.nodes.forEach(n=>{ if (n.ui === 'slider'){ const el = document.querySelector('[data-slider="'+n.id+'"]');
        if (el) el.value = parseFloat(n.body) || 0; } });
      document.querySelectorAll('[data-edit]').forEach(el=>{
        const n = nodeById(el.dataset.edit);
        if (n && n.mode === 'lit' && document.activeElement !== el) el.textContent = String(n.body);
      });
    }
  }
  else if (d.codon === 'brush') setBrush(d.name ? sanitize(d.name) : null);
  else if (d.codon === 'morph') setMorph(d.v, false);
  else if (d.codon === 'detail'){ S.settings.detail = d.v; render(); }
  else if (d.codon === 'fire'){                       // the host's own button, echoed in here
    const n = S.nodes.find(x=>x.id === d.name || sanitize(x.name||'') === sanitize(d.name||''));
    if (n){ flashBlock(n.id); bang(n.id); }
  }
  else if (d.codon === 'scene' && SCENES[d.name]) loadScene(d.name);
});
const _setBrush0 = setBrush;
setBrush = function(name){ _setBrush0(name); embedPost({ codon:'brush', name:name || null }); };
const _renderLive0 = renderLive;
renderLive = function(){ _renderLive0(); embedSync(); };

/* ---------- boot ---------- */
loadScene('play');
setMorph(0, true);
applyQuery();
if (new URLSearchParams(location.search).get('embed')){
  document.body.classList.add('embed');
  /* fitToBox owns the paper's transform in embed mode. setZoom does not know that and writes
     transform straight, so anything that re-zooms -- loading a scene, moving the morph slider --
     silently wiped the fit and left the diagram overflowing its panel. Wrap it too.           */
  // NOT requestAnimationFrame: an iframe below the fold gets no animation frames at all, so the
  // fit never ran until you scrolled to it -- which is exactly when you would notice it missing.
  const refit = ()=>{ if (!document.body.classList.contains('embed')) return;
    fitToBox(); setTimeout(fitToBox, 0); };
  const _r  = render;     render     = function(){ _r.apply(null, arguments); refit(); };
  const _am = applyMorph; applyMorph = function(){ _am.apply(null, arguments); refit(); };
  const _sz = setZoom;    setZoom    = function(z){ S.zoom = clamp(z, 0.25, 1.6); refit(); };
  addEventListener('resize', refit);
  [0, 60, 250, 700].forEach(t=>setTimeout(refit, t));
  if (window.parent !== window){
    _embedHost = window.parent;
    // announce a few times: whichever arrives first wins, and the host also pings us
    [0, 60, 250, 800].forEach(t=>setTimeout(()=>embedPost({ codon:'ready', names:Object.keys(embedValues()) }), t));
  }
}
